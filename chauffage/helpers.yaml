input_select:

  selecteur_planning_config:
    name: "Planning à Configurer"
    options:
      - "📅 Planning Normal"
      - "💼 Planning Télétravail"
      - "🏖️ Planning Vacances Maison"
      - "🎉 Planning Weekend Prolongé"
    initial: "📅 Planning Normal"
    icon: mdi:calendar-edit

template:
  - sensor:
      # Température corrigée RDC (-0.5°C offset capteur)
      - name: "Température RDC Corrigée"
        unique_id: temperature_rdc_corrigee
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set temp_brute = states('sensor.snzb_02d_rdc_z2m_temperature') | float(None) %}
          {% if temp_brute == None or temp_brute < 5 or temp_brute > 40 %}
          {{ this.state | float(20) }}
          {% else %}
          {% set correction = -0.5 %}
          {{ (temp_brute + correction) | round(1) }}
          {% endif %}
        availability: >
          {{ states('sensor.snzb_02d_rdc_z2m_temperature') not in ['unavailable', 'unknown', 'none'] }}
        icon: mdi:thermometer

      # Prochain bloc Télétravail (depuis input_datetime)
      - name: "Prochain Bloc Télétravail"
        unique_id: prochain_bloc_teletravail
        state: >
          {% set debut = states('input_datetime.teletravail_debut') %}
          {% set fin = states('input_datetime.teletravail_fin') %}
          {% if debut != 'unknown' and fin != 'unknown' %}
            {% set debut_dt = as_timestamp(debut) | timestamp_custom('%d/%m %Hh%M') %}
            {% set fin_dt = as_timestamp(fin) | timestamp_custom('%d/%m %Hh%M') %}
            {{ debut_dt }} → {{ fin_dt }}
          {% else %}
            Aucun
          {% endif %}
        icon: mdi:calendar-clock
        attributes:
          debut: "{{ states('input_datetime.teletravail_debut') }}"
          fin: "{{ states('input_datetime.teletravail_fin') }}"
          actif: >
            {% set now_ts = now().timestamp() %}
            {% set debut_ts = as_timestamp(states('input_datetime.teletravail_debut')) %}
            {% set fin_ts = as_timestamp(states('input_datetime.teletravail_fin')) %}
            {{ debut_ts <= now_ts <= fin_ts if debut_ts and fin_ts else false }}
