# ============================================================
# CHAUFFAGE - HELPERS
# Système de chauffage - Poêle à granulés
# Priorités : Vacances > Manuel > Boost > TT > VacMaison > WE+ > Normal > Éco
# Intégration dans configuration.yaml via packages ou !include
# ============================================================

input_number:

  # Températures de consigne
  temp_confort:
    name: "Température Confort"
    min: 19
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

  temp_eco:
    name: "Température Éco"
    min: 15
    max: 21
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low

  temp_consigne_active:
    name: "Consigne Active"
    min: 5
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-check

  temp_vacances:
    name: "Température Vacances"
    min: 5
    max: 18
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert

  boost_duree:
    name: "Durée Boost"
    min: 0.5
    max: 3
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:clock-outline

  boost_temperature_supplementaire:
    name: "Boost +°C"
    min: 0.5
    max: 4
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:plus-circle

  temp_consigne_manuelle:
    name: "Consigne Manuelle"
    min: 17
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert

input_boolean:

  # États chauffage
  chauffage_actif:
    name: "Chauffage"
    icon: mdi:radiator

  chauffage_manuel:
    name: "Mode Manuel"
    icon: mdi:hand-back-right

  mode_vacances:
    name: "Mode Vacances"
    icon: mdi:airplane-takeoff

  boost_temperature:
    name: "Boost Température"
    icon: mdi:fire-plus

  presence_maison:
    name: "Présence Maison"
    icon: mdi:home-account

  chauffage_desactive_ete:
    name: "Chauffage Désactivé (Été)"
    icon: mdi:power-off

  # Périodes horaires dynamiques (gérées par les automations Phase 2 de modes-planning)
  # Ces booleans sont ÉCRITS par modes-planning et LUS par le calcul de consigne
  test_periode_confort_active:
    name: "Test - Période Confort Active"
    icon: mdi:fire

  periode_normal_matin:
    name: "Période Normal Matin"
    icon: mdi:weather-sunset-up

  periode_normal_soir:
    name: "Période Normal Soir"
    icon: mdi:weather-sunset-down

  periode_normal_weekend:
    name: "Période Normal Weekend"
    icon: mdi:calendar-weekend

  periode_teletravail:
    name: "Période Télétravail"
    icon: mdi:laptop

  periode_vacances_maison:
    name: "Période Vacances Maison"
    icon: mdi:home-heart

  periode_weekend_prolonge:
    name: "Période Weekend Prolongé"
    icon: mdi:calendar-star

input_datetime:

  # Périodes modes chauffage (avec date + heure)
  vacances_debut:
    name: "Vacances - Début"
    has_date: true
    has_time: true

  vacances_fin:
    name: "Vacances - Fin"
    has_date: true
    has_time: true

  boost_fin:
    name: "Boost - Fin"
    has_date: true
    has_time: true

template:
  - sensor:
      # Température corrigée RDC (-0.5°C offset capteur)
      - name: "Température RDC Corrigée"
        unique_id: temperature_rdc_corrigee
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set temp_brute = states('sensor.snzb_02d_rdc_z2m_temperature') | float(None) %}
          {% if temp_brute == None or temp_brute < 5 or temp_brute > 40 %}
          {{ this.state | float(20) }}
          {% else %}
          {% set correction = -0.5 %}
          {{ (temp_brute + correction) | round(1) }}
          {% endif %}
        availability: >
          {{ states('sensor.snzb_02d_rdc_z2m_temperature') not in ['unavailable', 'unknown', 'none'] }}
        icon: mdi:thermometer
