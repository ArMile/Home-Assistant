            - condition: template
              value_template: "{{ trigger.entity_id == 'input_boolean.mode_planning_teletravail' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.mode_planning_vacances_maison
                  - input_boolean.mode_planning_weekend_prolonge
        
        # Si Vacances Maison activé
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'input_boolean.mode_planning_vacances_maison' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.mode_planning_teletravail
                  - input_boolean.mode_planning_weekend_prolonge
        
        # Si Weekend Prolongé activé
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'input_boolean.mode_planning_weekend_prolonge' }}"
          sequence:
            - service: input_boolean.turn_off
