              {{ now() < (debut | as_datetime) or now() > (fin | as_datetime) }}
            {% else %}
              false
            {% endif %}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_planning_weekend_prolonge
        - service: notify.persistent_notification
          data:
            title: "⏰ Planning Weekend Prolongé désactivé"
            message: |
              Le planning weekend prolongé est hors de sa plage de dates.
              Période configurée : {{ as_timestamp(states('input_datetime.weekend_prolonge_debut')) | timestamp_custom('%d/%m') }} - {{ as_timestamp(states('input_datetime.weekend_prolonge_fin')) | timestamp_custom('%d/%m') }}
              Retour au planning normal.
  mode: single

# --------------------------------------------
# 8.2 PROTECTION ANTI-BOUCLE DE NOTIFICATIONS
# --------------------------------------------
- id: protection_anti_boucle_notifications
  alias: "Protection - Anti-boucle notifications chauffage"
  description: "Empêche les notifications en rafale en cas de dysfonctionnement"
  mode: single
  max_exceeded: silent
  trigger:
    # Déclenché à chaque changement d'état du chauffage
    - platform: state
      entity_id: input_boolean.chauffage_actif
  action:
    # Créer un délai de 30 secondes entre chaque notification possible
    # Cela empêche les boucles infinies de notifications
    - delay:
        seconds: 30
        
# --------------------------------------------
# 9.1 NETTOYAGE DES PERIODES PLANNING
# --------------------------------------------
- alias: "Nettoyage Périodes- Modes Planning"
  description: "Désactive les périodes qui ne correspondent plus au mode actif"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
  action:
    # Si on n'est PAS en télétravail, désactiver sa période
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.periode_teletravail
    
    # Si on n'est PAS en vacances maison, désactiver sa période
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_vacances_maison
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.periode_vacances_maison
    
    # Si on n'est PAS en weekend prolongé, désactiver sa période
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_weekend_prolonge
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.periode_weekend_prolonge
  mode: restart

# ============================================
# 9.2 SYNCHRONISATION MODE PLANNING NORMAL
# ============================================
- alias: "Sync État Mode Normal"
  description: "Synchronise l'état du mode normal avec les autres modes"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
    - platform: homeassistant
      event: start
  action:
    - choose:
        # Si tous les modes spéciaux sont OFF → Mode Normal ON
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
              state: "off"
            - condition: state
              entity_id: input_boolean.mode_planning_vacances_maison
              state: "off"
            - condition: state
              entity_id: input_boolean.mode_planning_weekend_prolonge
              state: "off"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.mode_planning_normal
      # Sinon → Mode Normal OFF
      default:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_planning_normal
  mode: restart
# ============================================


# ============================================================
# 9. SYNC VACANCES SCOLAIRES
# ============================================================
# ============================================
# 9.3 SYNCHRONISATION AUTO MODE VACANCES MAISON DEPUIS CALENDRIER VACANCES SCOLAIRES
# ============================================
- alias: "Chauffage - Auto sync vacances maison"
  description: "Synchronise automatiquement le planning Vacances Maison avec les vacances scolaires"
  trigger:
    # Quand le sensor des vacances EN COURS change
    - platform: state
      entity_id: sensor.vacances_fr_current_zone_b
    
    # Quand le sensor des PROCHAINES vacances change
    - platform: state
      entity_id: sensor.vacances_fr_next_zone_b
    
    # Quand le binary_sensor "demain" change (passage d'avant à pendant)
    - platform: state
      entity_id: binary_sensor.vacances_fr_tomorrow_zone_b
      to: 'on'
    
    # Quand on sort des vacances (demain passe à off)
    - platform: state
      entity_id: binary_sensor.vacances_fr_tomorrow_zone_b
      to: 'off'
    
    # Vérification quotidienne à 6h
    - platform: time
      at: "06:00:00"
    
    # Vérification à minuit
    - platform: time
      at: "00:01:00"
    
    # Au démarrage de Home Assistant
    - platform: homeassistant
      event: start
  
  condition:
    # Vérifier que la sync auto est activée
    - condition: state
      entity_id: input_boolean.auto_sync_vacances_scolaires
      state: 'on'
    
    # Vérifier qu'on a des données valides
    - condition: or
      conditions:
        - condition: template
          value_template: >
            {{ states('sensor.vacances_fr_current_zone_b') not in ['unknown', 'unavailable', 'Aucune'] }}
        - condition: template
          value_template: >
            {{ states('sensor.vacances_fr_next_zone_b') not in ['unknown', 'unavailable'] }}
  
  action:
    - service: script.sync_vacances_maison_depuis_calendrier

- alias: "Chauffage - Clear vacances maison après période"
  description: "Efface les dates après vacances et sync avec prochaines"
  trigger:
    # Le lendemain de la fin des vacances (demain = off après avoir été on)
    - platform: state
      entity_id: binary_sensor.vacances_fr_tomorrow_zone_b
      to: 'off'
      for: "06:00:00"  # 6h après le passage à off = on est sûr d'être sorti
  
  condition:
    - condition: state
      entity_id: input_boolean.auto_sync_vacances_scolaires
      state: 'on'
    
    # Vérifier qu'on a bien des prochaines vacances disponibles
    - condition: template
      value_template: >
        {{ states('sensor.vacances_fr_next_zone_b') not in ['unknown', 'unavailable'] }}
  
  action:
    # Synchroniser avec les PROCHAINES vacances
    - service: script.sync_vacances_maison_depuis_calendrier
    
    # Notification
    - service: notify.persistent_notification
      data:
        title: "🏖️ Vacances Maison"
        message: "Vacances terminées. Planning mis à jour avec {{ states('sensor.vacances_fr_next_zone_b') }}."

- alias: "Chauffage - Clear vacances maison après période"
  description: "Efface les dates de vacances maison après la fin de la période"
  trigger:
    - platform: time
      at: "23:00:00"
  
  condition:
    - condition: state
      entity_id: input_boolean.auto_sync_vacances_scolaires
      state: 'on'
    
    - condition: template
      value_template: >
        {% set fin = states('input_datetime.vacances_maison_fin') %}
        {% if fin not in ['unknown', 'unavailable', ''] %}
          {{ as_timestamp(fin) < (as_timestamp(now()) - 86400) }}
        {% else %}
          false
        {% endif %}
  
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id:
          - input_datetime.vacances_maison_debut
          - input_datetime.vacances_maison_fin
      data:
        date: "1970-01-01"
    
    - service: notify.persistent_notification
      data:
        title: "🏖️ Vacances Maison"
        message: "Planning effacé automatiquement (vacances terminées)"
