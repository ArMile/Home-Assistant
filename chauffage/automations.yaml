    - platform: homeassistant
      event: start
  condition:
    # Seulement si planning normal actif
    - condition: state
      entity_id: input_boolean.mode_planning_teletravail
      state: "off"
    - condition: state
      entity_id: input_boolean.mode_planning_vacances_maison
      state: "off"
    - condition: state
      entity_id: input_boolean.mode_planning_weekend_prolonge
      state: "off"
    # Seulement en semaine
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  action:
    - choose:
        # ACTIVATION
        - conditions:
            - condition: template
              value_template: >
                {% set now_time = now().strftime('%H:%M:%S') %}
                {% set debut = states('input_datetime.planning_normal_lun_ven_matin_debut') %}
                {% set fin = states('input_datetime.planning_normal_lun_ven_matin_fin') %}
                {{ debut <= now_time < fin }}
          sequence:
            # DÉSACTIVER TOUS LES AUTRES MODES
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.periode_normal_soir
                  - input_boolean.periode_normal_weekend
                  - input_boolean.periode_teletravail
                  - input_boolean.periode_vacances_maison
                  - input_boolean.periode_weekend_prolonge
                  - input_boolean.periode_nuit
            # ACTIVER LE MODE MATIN
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.periode_normal_matin
      # DÉSACTIVATION
      default:
        - service: input_boolean.turn_off
