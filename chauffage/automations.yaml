# ============================================================
# TABLE DES MATIÈRES - AUTOMATIONS CHAUFFAGE
# Mise à jour : Mars 2026
# ============================================================
#
# ┌─────────────────────────────────────────────────────────────┐
# │ 0.  SYSTÈME                                          (1)    │
# │     0.1  Reboot_HA (quotidien 05:04)                        │
# ├─────────────────────────────────────────────────────────────┤
# │ 1.  CHAUFFAGE - CALCUL CONSIGNE                      (1)    │
# │     1.2  Chauffage - Calcul Consigne (priorités 1→8)        │
# ├─────────────────────────────────────────────────────────────┤
# │ 2.  CHAUFFAGE - RÉGULATION                           (2)    │
# │     2.1  Chauffage - Allumer (hystérésis -0.3°C)            │
# │     2.2  Chauffage - Éteindre (+0.5°C)                      │
# ├─────────────────────────────────────────────────────────────┤
# │ 3.  MODE VACANCES ABSENCE - PRIORITÉ 1               (3)    │
# │     3.1  Planning - Vacances Auto (activation/désact.)      │
# │     3.2  Vacances - Appliquer Température                   │
# │     3.4  Vacances - Retour Planning                         │
# ├─────────────────────────────────────────────────────────────┤
# │ 4.  BOOST TEMPÉRATURE                                (5)    │
# │     4.1  Boost - Activation                                 │
# │     4.2  Boost - Désactivation Auto                         │
# │     4.3  Chauffage - Retour Auto depuis Mode Manuel         │
# │     4.4  Manuel - Bloquer si Vacances Actif                 │
# │     4.5  Vacances - Bloquer Boost                           │
# ├─────────────────────────────────────────────────────────────┤
# │ 5.  SYNCHRONISATION ÉTAT CHAUFFAGE                   (1)    │
# │     5.1  Chauffage - Sync État Réel                         │
# ├─────────────────────────────────────────────────────────────┤
# │ 6.  MODE ÉTÉ                                         (3)    │
# │     6.1  Été - Bloquer Activation Chauffage                 │
# │     6.2  Été - Notification Activation                      │
# │     6.3  Été - Notification Désactivation                   │
# └─────────────────────────────────────────────────────────────┘
#
# TOTAL : 16 automations
# Note : Les automations de gestion des modes planning (sections 7-10)
#        et la synchronisation calendriers (section 17) sont dans modes-planning/automations.yaml
# ============================================================

# ============================================
# AUTOMATISATION REBOOT HA
# ============================================

# ============================================================
# 0. SYSTÈME
# ============================================================
# ------------------------------------------------------------
# 0.1 Reboot HA quotidien (05:04, tous les jours)
# ------------------------------------------------------------
- id: '1709502711913'
  alias: Reboot_HA
  description: ''
  triggers:
  - hours: '5'
    minutes: '04'
    seconds: '55'
    trigger: time_pattern
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  # Notification Email AVANT le reboot
  - service: notify.ha_email
    data:
      title: "🔄 Home Assistant - Reboot Programmé"
      message: >
        Home Assistant va redémarrer dans quelques secondes.

        Heure: {{ now().strftime('%d/%m/%Y %H:%M:%S') }}
        Raison: Reboot quotidien programmé

        Le système sera de nouveau opérationnel dans ~2-3 minutes.

  # Attendre 2 secondes que l'email parte
  - delay:
      seconds: 30

  # Reboot
  - metadata: {}
    data: {}
    action: hassio.host_reboot
  mode: single

# ============================================
# Automatisations du système de chauffage
# Mise à jour : Mars 2026
# ============================================

# ============================================================
# 1. CHAUFFAGE - CALCUL CONSIGNE
# ============================================================
# ------------------------------------------------------------
# 1.2 Chauffage - Calcul Consigne (priorités 1→8)
# ------------------------------------------------------------
# ============================================
# CALCUL DE LA CONSIGNE DE TEMPÉRATURE
# VERSION CORRIGÉE - Utilise input_boolean.periode_* au lieu des schedules
# ============================================
- alias: "Chauffage - Calcul Consigne"
  description: "Détermine la température de consigne selon mode et planning"
  trigger:
    # Changements des périodes (remplace les anciens schedules)
    - platform: state
      entity_id:
        - input_boolean.periode_normal_matin
        - input_boolean.periode_normal_soir
        - input_boolean.periode_normal_weekend
        - input_boolean.periode_teletravail
        - input_boolean.periode_vacances_maison
        - input_boolean.periode_weekend_prolonge
    # Changements de modes spéciaux
    - platform: state
      entity_id:
        - input_boolean.mode_vacances
        - input_boolean.boost_temperature
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
    # Température vacances
    - platform: state
      entity_id: input_number.temp_vacances
    # Changements Mode Manuel
    - platform: state
      entity_id: input_number.temp_consigne_manuelle
    - platform: state
      entity_id: input_boolean.chauffage_manuel
    # Vérification périodique toutes les 5 minutes
    - platform: time_pattern
      minutes: "/5"
    # Au démarrage de Home Assistant
    - platform: homeassistant
      event: start

  action:
    - choose:
        # ========================================
        # PRIORITÉ 1 : MODE VACANCES (ABSENCE)
        # ========================================
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_vacances
              state: "on"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.temp_consigne_active
              data:
                value: "{{ states('input_number.temp_vacances') | float }}"

        # ========================================
        # PRIORITÉ 2 : MODE MANUEL
        # ========================================
        - conditions:
            - condition: state
              entity_id: input_boolean.chauffage_manuel
              state: "on"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.temp_consigne_active
              data:
                value: "{{ states('input_number.temp_consigne_manuelle') | float }}"

        # ========================================
        # PRIORITÉ 3 : BOOST ACTIF
        # ========================================
        - conditions:
            - condition: state
              entity_id: input_boolean.boost_temperature
              state: "on"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.temp_consigne_active
              data:
                value: >
                  {% set base_temp = states('input_number.temp_eco') | float %}
                  {% if is_state('input_boolean.periode_normal_matin', 'on') or
                        is_state('input_boolean.periode_normal_soir', 'on') or
                        is_state('input_boolean.periode_normal_weekend', 'on') or
                        is_state('input_boolean.periode_teletravail', 'on') or
                        is_state('input_boolean.periode_vacances_maison', 'on') or
                        is_state('input_boolean.periode_weekend_prolonge', 'on') %}
                    {% set base_temp = states('input_number.temp_confort') | float %}
                  {% endif %}
                  {{ base_temp + (states('input_number.boost_temperature_supplementaire') | float) }}

        # ========================================
        # PRIORITÉ 4 : PLANNING TÉLÉTRAVAIL
        # ========================================
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
              state: "on"
          sequence:
            - choose:
                # Si dans la plage horaire : Confort
                - conditions:
                    - condition: state
                      entity_id: input_boolean.periode_teletravail
                      state: "on"
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: input_number.temp_consigne_active
                      data:
                        value: "{{ states('input_number.temp_confort') | float }}"
              # Sinon : Éco
              default:
                - service: input_number.set_value
                  target:
                    entity_id: input_number.temp_consigne_active
                  data:
                    value: "{{ states('input_number.temp_eco') | float }}"

        # ========================================
        # PRIORITÉ 5 : PLANNING VACANCES MAISON
        # ========================================
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_vacances_maison
              state: "on"
          sequence:
            - choose:
                # Si dans la plage horaire : Confort
                - conditions:
                    - condition: state
                      entity_id: input_boolean.periode_vacances_maison
                      state: "on"
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: input_number.temp_consigne_active
                      data:
                        value: "{{ states('input_number.temp_confort') | float }}"
              # Sinon : Éco
              default:
                - service: input_number.set_value
                  target:
                    entity_id: input_number.temp_consigne_active
                  data:
                    value: "{{ states('input_number.temp_eco') | float }}"

        # ========================================
        # PRIORITÉ 6 : PLANNING WEEKEND PROLONGÉ
        # ========================================
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_weekend_prolonge
              state: "on"
          sequence:
            - choose:
                # Si dans la plage horaire : Confort
                - conditions:
                    - condition: state
                      entity_id: input_boolean.periode_weekend_prolonge
                      state: "on"
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: input_number.temp_consigne_active
                      data:
                        value: "{{ states('input_number.temp_confort') | float }}"
              # Sinon : Éco
              default:
                - service: input_number.set_value
                  target:
                    entity_id: input_number.temp_consigne_active
                  data:
                    value: "{{ states('input_number.temp_eco') | float }}"

        # ========================================
        # PRIORITÉ 7 : MODE CONFORT (PLANNING NORMAL)
        # ========================================
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: input_boolean.periode_normal_matin
                  state: "on"
                - condition: state
                  entity_id: input_boolean.periode_normal_soir
                  state: "on"
                - condition: state
                  entity_id: input_boolean.periode_normal_weekend
                  state: "on"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.temp_consigne_active
              data:
                value: "{{ states('input_number.temp_confort') | float }}"

      # ========================================
      # PRIORITÉ 8 : MODE ÉCO (DÉFAUT)
      # ========================================
      default:
        - service: input_number.set_value
          target:
            entity_id: input_number.temp_consigne_active
          data:
            value: "{{ states('input_number.temp_eco') | float }}"
  mode: single

# ============================================================
# 2. CHAUFFAGE - RÉGULATION
# ============================================================
# ============================================
# 2. RÉGULATION DU CHAUFFAGE
# ============================================
# --------------------------------------------
# 2.1 ALLUMAGE DU CHAUFFAGE
# --------------------------------------------
- alias: "Chauffage - Allumer"
  trigger:
    # Trigger principal : condition de température
    - platform: template
      value_template: >
        {% set temp = states('sensor.temperature_rdc_corrigee') | float(None) %}
        {% set consigne = states('input_number.temp_consigne_active') | float(None) %}
        {{ temp != None and consigne != None and temp <= (consigne - 0.3) }}
      for:
        minutes: 3

  condition:
    - condition: state
      entity_id: input_boolean.chauffage_actif
      state: "off"

    # MODE ETE - CHAUFFAGE DESACTIVE
    - condition: state
      entity_id: input_boolean.chauffage_desactive_ete
      state: "off"

  action:
    # PHASE PRODUCTION : CONTACTEUR RÉEL
    - service: switch.turn_on
      target:
        entity_id: switch.Poele_a_Granules

    # Synchronisation de l'affichage
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.chauffage_actif

    # Notification
    - service: notify.persistent_notification
      data:
        title: "🔥 Chauffage ALLUMÉ"
        message: >
          ⏰ {{ now().strftime('%H:%M:%S') }}
          🌡️ Température : {{ states('sensor.temperature_rdc_corrigee') }}°C
          🎯 Consigne : {{ states('input_number.temp_consigne_active') }}°C
          📏 Seuil : {{ (states('input_number.temp_consigne_active')|float - 0.3)|round(1) }}°C
  mode: single

# --------------------------------------------
# 2.2 EXTINCTION DU CHAUFFAGE
# --------------------------------------------
- alias: "Chauffage - Éteindre"
  trigger:
    # Trigger principal : condition de température
    - platform: template
      value_template: >
        {% set temp = states('sensor.temperature_rdc_corrigee') | float(None) %}
        {% set consigne = states('input_number.temp_consigne_active') | float(None) %}
        {{ temp != None and consigne != None and temp >= (consigne + 0.5) }}
      for:
        minutes: 3

  condition:
    - condition: state
      entity_id: input_boolean.chauffage_actif
      state: "on"

  action:
    # PHASE PRODUCTION : CONTACTEUR RÉEL
    - service: switch.turn_off
      target:
        entity_id: switch.Poele_a_Granules

    # Synchronisation de l'affichage
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chauffage_actif

    # Notification
    - service: notify.persistent_notification
      data:
        title: "❄️ Chauffage ÉTEINT"
        message: >
          ⏰ {{ now().strftime('%H:%M:%S') }}
          🌡️ Température : {{ states('sensor.temperature_rdc_corrigee') }}°C
          🎯 Consigne : {{ states('input_number.temp_consigne_active') }}°C
          📏 Seuil : {{ (states('input_number.temp_consigne_active')|float + 0.5)|round(1) }}°C
  mode: single

# ============================================================
# 3. MODE VACANCES ABSENCE - PRIORITÉ 1
# ============================================================
# ============================================
# 3. MODE VACANCES (Absence) - PRIORITÉ 1
# ============================================
# --------------------------------------------
# 3.1 ACTIVATION AUTOMATIQUE MODE VACANCES ENTRE DATES DE DEBUT ET DE FIN
# --------------------------------------------
- alias: "Planning - Vacances Auto"
  description: "Active/désactive le mode vacances selon les dates"
  trigger:
    - platform: time_pattern
      minutes: '/1'
    - platform: state
      entity_id:
        - input_datetime.vacances_debut
        - input_datetime.vacances_fin
        - input_boolean.mode_vacances
  condition: []
  action:
    - choose:
        # ACTIVATION
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_vacances
              state: 'off'
            - condition: template
              value_template: >
                {% set debut = states('input_datetime.vacances_debut') %}
                {% set fin = states('input_datetime.vacances_fin') %}
                {% if debut not in ['unknown', 'unavailable', 'none'] and fin not in ['unknown', 'unavailable', 'none'] %}
                  {{ as_timestamp(now()) >= as_timestamp(debut) and as_timestamp(now()) <= as_timestamp(fin) }}
                {% else %} false {% endif %}
          sequence:
            - service: input_boolean.turn_on
              target: {entity_id: input_boolean.mode_vacances}
            - service: notify.persistent_notification
              data:
                title: 🛫 Mode Vacances activé
                message: |
                  Mode Vacances (Absence) activé automatiquement.

                  🌡️ Température : {{ states('input_number.temp_vacances') }}°C

                  🗓️ Du {{ as_timestamp(states('input_datetime.vacances_debut')) | timestamp_custom('%d/%m/%Y à %H:%M') }} au {{ as_timestamp(states('input_datetime.vacances_fin')) | timestamp_custom('%d/%m/%Y à %H:%M') }}

        # DÉSACTIVATION
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_vacances
              state: 'on'
            - condition: template
              value_template: >
                {% set debut = states('input_datetime.vacances_debut') %}
                {% set fin = states('input_datetime.vacances_fin') %}
                {% if debut not in ['unknown', 'unavailable', 'none'] and fin not in ['unknown', 'unavailable', 'none'] %}
                  {{ as_timestamp(now()) < as_timestamp(debut) or as_timestamp(now()) > as_timestamp(fin) }}
                {% else %} false {% endif %}
          sequence:
            - service: input_boolean.turn_off
              target: {entity_id: input_boolean.mode_vacances}
            - service: notify.persistent_notification
              data:
                title: 🏠 Retour de Vacances
                message: Mode désactivé automatiquement
  mode: single

# ============================================
# 3.2 APPLICATION DE LA TEMPÉRATURE VACANCES
# ============================================
- alias: "Vacances - Appliquer Température"
  description: "Applique la température quand mode vacances actif"
  trigger:
    - platform: state
      entity_id: input_boolean.mode_vacances
      to: "on"
    - platform: state
      entity_id: input_number.temp_vacances
  condition:
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "on"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.temp_consigne_active
      data:
        value: "{{ states('input_number.temp_vacances') | float }}"
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.chauffage_manuel
          - input_boolean.boost_temperature
    - service: notify.persistent_notification
      data:
        title: "✈️ Mode Vacances Appliqué"
        message: "Température réglée à {{ states('input_number.temp_vacances') }}°C"
  mode: restart

# ============================================
# 3.4 RETOUR AU PLANNING NORMAL
# ============================================
- alias: "Vacances - Retour Planning"
  description: "Restaure le planning quand mode vacances désactivé"
  trigger:
    - platform: state
      entity_id: input_boolean.mode_vacances
      to: "off"
  action:
    - service: automation.trigger
      target:
        entity_id: automation.chauffage_calcul_consigne
    - service: notify.persistent_notification
      data:
        title: "🏠 Planning Restauré"
        message: >
          Retour au planning automatique.
          Consigne : {{ states('input_number.temp_consigne_active') }}°C
  mode: single

# ============================================================
# 4. BOOST TEMPÉRATURE
# ============================================================
# ============================================
# 4. BOOST TEMPÉRATURE
# ============================================
# --------------------------------------------
# 4.1 ACTIVATION DU BOOST
# --------------------------------------------
- alias: "Boost - Activation"
  description: "Active le boost pour la durée définie"
  trigger:
    - platform: state
      entity_id: input_boolean.boost_temperature
      to: "on"
  action:
    # Calculer l'heure de fin du boost
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.boost_fin
      data:
        datetime: >
          {{ (now() + timedelta(hours=states('input_number.boost_duree')|float)) }}

    # Notification
    - service: notify.persistent_notification
      data:
        title: "🔥 Mode Boost Activé"
        message: |
          Mode Boost activé.

          🌡️ Température boost : +{{ states('input_number.boost_temperature_supplementaire') }}°C
          🎯 Consigne totale : {{ states('input_number.temp_consigne_active') }}°C

          ⏱️ Durée : {{ states('input_number.boost_duree') | int }} heure(s)
          🕐 Fin prévue : {{ as_timestamp(states('input_datetime.boost_fin')) | timestamp_custom('%H:%M') }}
  mode: single

# --------------------------------------------
# 4.2 DÉSACTIVATION AUTOMATIQUE DU BOOST
# --------------------------------------------
- alias: "Boost - Désactivation Auto"
  description: "Désactive le boost après la durée définie"
  trigger:
    - platform: template
      value_template: >
        {% set fin = states('input_datetime.boost_fin') %}
        {% if fin not in ['unknown', 'unavailable', 'none', ''] %}
          {{ as_timestamp(now()) >= as_timestamp(fin) }}
        {% else %}
          false
        {% endif %}
  condition:
    - condition: state
      entity_id: input_boolean.boost_temperature
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.boost_temperature
    - service: notify.persistent_notification
      data:
        title: "❄️ Boost Terminé"
        message: "Retour au Mode Planning"
  mode: single


# --------------------------------------------
# 4.3 DÉSACTIVATION MODE MANUEL CHANGEMENT PLANNING
# --------------------------------------------
- alias: "Chauffage - Retour Auto depuis Mode Manuel"
  description: "Désactive le mode manuel aux changements de plage horaire"
  trigger:
    - platform: state
      entity_id:
        - schedule.chauffage_semaine_matin
        - schedule.chauffage_semaine_soir
        - schedule.chauffage_weekend
  condition:
    - condition: state
      entity_id: input_boolean.chauffage_manuel
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chauffage_manuel
    - service: notify.persistent_notification
      data:
        title: "🤖 Retour Automatique"
        message: >
          Mode manuel désactivé automatiquement.
          Retour au planning automatique.
          Nouvelle consigne : {{ states('input_number.temp_consigne_active') }}°C
  mode: single

# --------------------------------------------
# 4.4 DÉSACTIVATION MODE MANUEL
# --------------------------------------------
- alias: "Manuel - Bloquer si Vacances Actif"
  description: "Empêche l'activation du mode manuel si vacances actives"
  trigger:
    - platform: state
      entity_id: input_boolean.chauffage_manuel
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chauffage_manuel
    - service: notify.persistent_notification
      data:
        title: "⚠️ Mode Manuel Bloquée"
        message: "Le mode manuel ne peut pas être activé pendant les vacances."
  mode: single

# --------------------------------------------
# 4.5 DÉSACTIVATION MODE BOOST
# --------------------------------------------
- alias: "Vacances - Bloquer Boost"
  description: "Empêche l'activation du boost en mode vacances"
  trigger:
    - platform: state
      entity_id: input_boolean.boost_temperature
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.boost_temperature
    - service: notify.persistent_notification
      data:
        title: "⚠️ Mode Boost Bloqué"
        message: "Le boost est désactivé en mode vacances"
  mode: restart

# ============================================================
# 5. SYNCHRONISATION ÉTAT CHAUFFAGE
# ============================================================
# ============================================
# 5. SYNCHRONISATION (Pour production)
# ============================================
# Cette automatisation synchronise l'état affiché avec le contacteur physique

- alias: "Chauffage - Sync État Réel"
  description: "Synchronise l'affichage avec l'état réel du contacteur"
  trigger:
    - platform: state
      entity_id: switch.Poele_a_Granules #Contacteur Poele Etat
      to:
        - "on"
        - "off"
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.Poele_a_Granules #Contacteur Poele ON
              state: "on"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.chauffage_actif

        - conditions:
            - condition: state
              entity_id: switch.Poele_a_Granules #Contacteur Poele OFF
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.chauffage_actif
  mode: single

# ============================================================
# 6. MODE ÉTÉ
# ============================================================
# ============================================
# 6. MODE ÉTÉ - DÉSACTIVATION CHAUFFAGE
# ============================================
- alias: "Été - Bloquer Activation Chauffage"
  description: "Empêche toute activation du chauffage en mode été"
  trigger:
    - platform: state
      entity_id: input_boolean.chauffage_actif
      to: "on"
    - platform: state
      entity_id: switch.Poele_a_Granules
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.chauffage_desactive_ete
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.Poele_a_Granules
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chauffage_actif
    - service: notify.persistent_notification
      data:
        title: "⚠️ Chauffage Bloqué"
        message: >
          Le chauffage est désactivé pour l'été.
          Désactivez le mode "Chauffage Désactivé (Été)" pour le réactiver.
  mode: restart

- alias: "Été - Notification Activation"
  description: "Informe de l'activation du mode été"
  trigger:
    - platform: state
      entity_id: input_boolean.chauffage_desactive_ete
      to: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.Poele_a_Granules
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chauffage_actif
    - service: notify.persistent_notification
      data:
        title: "☀️ Mode Été Activé"
        message: >
          Le chauffage est maintenant complètement désactivé.
          Le contacteur ne pourra plus être activé jusqu'à la désactivation du mode été.
  mode: single

- alias: "Été - Notification Désactivation"
  description: "Informe de la désactivation du mode été"
  trigger:
    - platform: state
      entity_id: input_boolean.chauffage_desactive_ete
      to: "off"
  action:
    - service: notify.persistent_notification
      data:
        title: "🍂 Mode Été Désactivé"
        message: >
          Le chauffage est maintenant réactivé.
          Les automatisations de régulation fonctionnent à nouveau normalement.
  mode: single
