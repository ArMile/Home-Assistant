# ============================================================
# 8. PROTECTION & NETTOYAGE
# ============================================================
# --------------------------------------------
# 8.1 VÉRIFICATION QUOTIDIENNE DES DATES EXPIRÉES
# --------------------------------------------
- id: planning_verification_dates_expirees
  alias: "Protection - Vérification dates hors plage"
  description: "Vérifie si des plannings sont hors de leur plage de dates (avant début OU après fin)"
  trigger:
    # Vérification à minuit
    - platform: time
      at: "00:01:00"
    
    # Vérification au démarrage de HA
    - platform: homeassistant
      event: start
    
    # Vérification toutes les 5 minutes (optionnel mais recommandé)
    - platform: time_pattern
      minutes: "/5"
    
    # Vérification immédiate si une date change
    - platform: state
      entity_id:
        - input_datetime.teletravail_debut
        - input_datetime.teletravail_fin
        - input_datetime.vacances_maison_debut
        - input_datetime.vacances_maison_fin
        - input_datetime.weekend_prolonge_debut
        - input_datetime.weekend_prolonge_fin
        - input_datetime.vacances_debut
        - input_datetime.vacances_fin
  
  action:
    # ========================================
    # MODE VACANCES (ABSENT)
    # ========================================
    - if:
        - condition: state
          entity_id: input_boolean.mode_vacances
          state: "on"
        - condition: template
          value_template: >
            {% set debut = states('input_datetime.vacances_debut') %}
            {% set fin = states('input_datetime.vacances_fin') %}
            {% if debut not in ['unknown', 'unavailable', 'none', '1970-01-01 00:00:00'] and
                  fin not in ['unknown', 'unavailable', 'none', '1970-01-01 23:00:00'] %}
              {{ now() < (debut | as_datetime) or now() > (fin | as_datetime) }}
            {% else %}
              false
            {% endif %}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_vacances
        - service: notify.persistent_notification
          data:
            title: "⏰ Mode Vacances désactivé"
            message: |
              Le mode vacances est hors de sa plage de dates.
              Période configurée : {{ as_timestamp(states('input_datetime.vacances_debut')) | timestamp_custom('%d/%m à %H:%M') }} - {{ as_timestamp(states('input_datetime.vacances_fin')) | timestamp_custom('%d/%m à %H:%M') }}
