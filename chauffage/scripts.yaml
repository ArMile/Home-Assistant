# ============================================
# RETOUR AU PLANNING NORMAL
# ============================================
planning_mode_normal:
  alias: Retour Planning Normal
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.mode_planning_teletravail
          - input_boolean.mode_planning_vacances_maison
          - input_boolean.mode_planning_weekend_prolonge
    - service: notify.persistent_notification
      data:
        title: "📅 Planning Normal Activé"
        message: "Retour au planning hebdomadaire normal"
  mode: single
  icon: mdi:calendar-check

# ============================================
# SCRIPT D'URGENCE - RÉINITIALISATION COMPLÈTE
# ============================================
reinitialiser_tous_plannings:
  alias: "🔄 URGENCE - Réinitialiser tous les plannings"
  description: "Script d'urgence pour désactiver tous les modes et réinitialiser les dates"
  sequence:
    # Étape 1 : Désactiver TOUS les modes spéciaux
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.mode_vacances
          - input_boolean.mode_planning_teletravail
          - input_boolean.mode_planning_vacances_maison
          - input_boolean.mode_planning_weekend_prolonge
          - input_boolean.boost_temperature
          - input_boolean.chauffage_manuel
    
    # Étape 2 : Réinitialiser les dates Mode Vacances (Absent)
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.vacances_debut
      data:
        datetime: "1970-01-01 00:00:00"
    
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.vacances_fin
      data:
        datetime: "1970-01-01 23:00:00"
    
    # Étape 3 : Réinitialiser les dates Télétravail
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.teletravail_debut
      data:
        datetime: "1970-01-01 00:00:00"
    
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.teletravail_fin
      data:
        datetime: "1970-01-01 23:00:00"
    
    # Étape 4 : Réinitialiser les dates Vacances Maison
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.vacances_maison_debut
      data:
        datetime: "1970-01-01 00:00:00"
    
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.vacances_maison_fin
      data:
        datetime: "1970-01-01 23:00:00"
    
    # Étape 5 : Réinitialiser les dates Weekend Prolongé
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.weekend_prolonge_debut
      data:
        datetime: "1970-01-01 00:00:00"
    
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.weekend_prolonge_fin
      data:
        datetime: "1970-01-01 23:00:00"
    
    # Étape 6 : Notification de réinitialisation
    - service: notify.persistent_notification
      data:
        title: "🔄 Réinitialisation complète effectuée"
        message: |
          Tous les plannings spéciaux ont été désactivés et réinitialisés.
          Le système est maintenant en mode Planning Normal.
          
          États après réinitialisation :
          - Mode Vacances (Absent) : OFF (dates : 01/01/1970)
          - Mode Télétravail : OFF (dates : 01/01/1970)
          - Mode Vacances Maison : OFF (dates : 01/01/1970)
          - Mode Weekend Prolongé : OFF (dates : 01/01/1970)
          - Mode Boost : OFF
          - Mode Manuel : OFF
          
          Le système suit maintenant le planning hebdomadaire normal.
    
    # Étape 7 : Petit délai pour stabilisation
    - delay:
        seconds: 2
    
    # Étape 8 : Retour explicite au mode normal
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.mode_planning_normal
  
  mode: single
  icon: mdi:restart-alert

