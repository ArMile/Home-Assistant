views:
  - title: Chauffage
    path: chauffage-principal
    icon: mdi:radiator
    theme: Backend-selected=default
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr 1fr
          grid-gap: 12px
          margin: 0
          padding: 12px
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🌡️ Chauffage
                subtitle: >
                  {{ states('sensor.temperature_rdc_corrigee') }}°C → {{
                  states('input_number.temp_consigne_active') }}°C
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.temperature_rdc_corrigee
                    primary: '{{ states(''sensor.temperature_rdc_corrigee'') }}°C'
                    secondary: Température actuelle
                    icon: mdi:thermometer
                    icon_color: >
                      {% set temp = states('sensor.temperature_rdc_corrigee') |
                      float(0) %} {% set consigne =
                      states('input_number.temp_consigne_active') | float(0) %}
                      {% if temp >= consigne %}green {% elif temp >= consigne -
                      1 %}orange {% else %}red{% endif %}
                    badge_icon: mdi:home-thermometer
                    badge_color: >
                      {% set temp = states('sensor.temperature_rdc_corrigee') |
                      float(0) %} {% set consigne =
                      states('input_number.temp_consigne_active') | float(0) %}
                      {% if temp >= consigne %}green{% else %}orange{% endif %}
                    tap_action:
                      action: more-info
                    card_mod:
                      style: >
                        ha-card {
                          {% set temp = states('sensor.temperature_rdc_corrigee') | float(0) %}
                          {% set consigne = states('input_number.temp_consigne_active') | float(0) %}
                          {% if temp >= consigne %}
                            background: rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50;
                          {% elif temp >= consigne - 1 %}
                            background: rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800;
                          {% else %}
                            background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                          {% endif %}
                          transition: all 0.3s ease;
                        }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: custom:mushroom-template-card
                    entity: input_number.temp_consigne_active
                    primary: '{{ states(''input_number.temp_consigne_active'') }}°C'
                    secondary: Consigne active
                    icon: mdi:target
                    icon_color: blue
                    badge_icon: mdi:bullseye-arrow
                    badge_color: blue
                    tap_action:
                      action: more-info
                    card_mod:
                      style: >
                        ha-card {
                          background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                          transition: all 0.3s ease;
                        }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
              - type: conditional
                conditions:
                  - entity: input_boolean.chauffage_actif
                    state: 'on'
                card:
                  type: custom:mushroom-template-card
                  entity: input_boolean.chauffage_actif
                  primary: 🔥 Chauffage ALLUMÉ
                  secondary: ''
                  icon: mdi:fire
                  icon_color: deep-orange
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 87, 34, 0.15); border-left: 4px solid #FF9800;
                      }
              - type: conditional
                conditions:
                  - entity: input_boolean.chauffage_actif
                    state: 'off'
                card:
                  type: custom:mushroom-template-card
                  entity: input_boolean.chauffage_actif
                  primary: ❄️ Chauffage ÉTEINT
                  secondary: ''
                  icon: mdi:snowflake
                  icon_color: light-blue
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(3, 169, 244, 0.1); border-left: 4px solid #F44336;
                      }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:home
                    content: Accueil
                    icon_color: blue
                    tap_action:
                      action: navigate
                      navigation_path: /dashboard-accueil/home
                  - type: template
                    icon: >
                      {% if is_state('input_boolean.mode_vacances', 'on')
                      %}mdi:airplane {% elif
                      is_state('input_boolean.chauffage_manuel', 'on')
                      %}mdi:hand-back-right {% elif
                      is_state('input_boolean.boost_temperature', 'on')
                      %}mdi:fire-alert {% elif
                      is_state('input_boolean.mode_planning_teletravail', 'on')
                      %}mdi:laptop {% elif
                      is_state('input_boolean.mode_planning_vacances_maison',
                      'on') %}mdi:home-heart {% elif
                      is_state('input_boolean.mode_planning_weekend_prolonge',
                      'on') %}mdi:party-popper {% else %}mdi:calendar-check{%
                      endif %}
                    content: >
                      {% if is_state('input_boolean.mode_vacances', 'on') %}Mode
                      Vacances {% elif
                      is_state('input_boolean.chauffage_manuel', 'on') %}Mode
                      Manuel {% elif is_state('input_boolean.boost_temperature',
                      'on') %}Mode Boost {% elif
                      is_state('input_boolean.mode_planning_teletravail', 'on')
                      %}Mode Télétravail {% elif
                      is_state('input_boolean.mode_planning_vacances_maison',
                      'on') %}Vacances Maison {% elif
                      is_state('input_boolean.mode_planning_weekend_prolonge',
                      'on') %}Weekend Prolongé {% else %}Planning Normal{% endif
                      %}
                    icon_color: >
                      {% if is_state('input_boolean.mode_vacances', 'on') %}blue
                      {% elif is_state('input_boolean.chauffage_manuel', 'on')
                      %}orange {% elif
                      is_state('input_boolean.boost_temperature', 'on') %}red {%
                      elif is_state('input_boolean.mode_planning_teletravail',
                      'on') %}teal {% elif
                      is_state('input_boolean.mode_planning_vacances_maison',
                      'on') %}pink {% elif
                      is_state('input_boolean.mode_planning_weekend_prolonge',
                      'on') %}purple {% else %}green{% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          animation: pulse 2s ease-in-out infinite;
                        }
                        @keyframes pulse {
                          0%, 100% { opacity: 1; }
                          50% { opacity: 0.6; }
                        }
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: ✋ Contrôle Manuel
              - type: custom:mushroom-entity-card
                entity: input_boolean.chauffage_manuel
                name: Mode Manuel
                icon: mdi:hand-back-right
                icon_color: >
                  {% if is_state('input_boolean.chauffage_manuel', 'on')
                  %}orange{% else %}grey{% endif %}
                badge_icon: >
                  {% if is_state('input_boolean.chauffage_manuel', 'on')
                  %}mdi:check-bold{% else %}mdi:close-thick{% endif %}
                badge_color: >
                  {% if is_state('input_boolean.chauffage_manuel', 'on')
                  %}orange{% else %}grey{% endif %}
                tap_action:
                  action: toggle
                  haptic: medium
                card_mod:
                  style: >
                    ha-card {
                      {% if is_state('input_boolean.chauffage_manuel', 'on') %}
                        background: rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800;
                      {% else %}
                        background: rgba(255, 255, 255, 0.03); border-left: 4px solid #757575;
                      {% endif %}
                      transition: all 0.3s ease;
                    }

                    ha-card:hover { transform: translateY(-2px); box-shadow: 0
                    4px 8px rgba(0,0,0,0.2); }
              - type: conditional
                conditions:
                  - entity: input_boolean.chauffage_manuel
                    state: 'on'
                card:
                  type: custom:mushroom-number-card
                  entity: input_number.temp_consigne_manuelle
                  name: Consigne Manuelle
                  icon: mdi:thermometer-lines
                  icon_color: orange
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🔥 Boost Température
              - type: custom:mushroom-entity-card
                entity: input_boolean.boost_temperature
                name: Mode Boost
                icon: mdi:fire-alert
                icon_color: >
                  {% if is_state('input_boolean.boost_temperature', 'on')
                  %}red{% else %}grey{% endif %}
                badge_icon: >
                  {% if is_state('input_boolean.boost_temperature', 'on')
                  %}mdi:check-bold{% else %}mdi:close-thick{% endif %}
                badge_color: >
                  {% if is_state('input_boolean.boost_temperature', 'on')
                  %}red{% else %}grey{% endif %}
                tap_action:
                  action: toggle
                  haptic: medium
                card_mod:
                  style: >
                    ha-card {
                      {% if is_state('input_boolean.boost_temperature', 'on') %}
                        background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                      {% else %}
                        background: rgba(255, 255, 255, 0.03); border-left: 4px solid #757575;
                      {% endif %}
                      transition: all 0.3s ease;
                    }

                    ha-card:hover { transform: translateY(-2px); box-shadow: 0
                    4px 8px rgba(0,0,0,0.2); }
              - type: conditional
                conditions:
                  - entity: input_boolean.boost_temperature
                    state: 'on'
                card:
                  type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-number-card
                      entity: input_number.boost_temperature_supplementaire
                      name: +°C
                      icon: mdi:thermometer-plus
                      icon_color: red
                    - type: custom:mushroom-number-card
                      entity: input_number.boost_duree
                      name: Durée (h)
                      icon: mdi:timer-sand
                      icon_color: red
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🔵⚪🔴 EDF Tempo
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.rte_tempo_couleur_actuelle_visuel
                    primary: '{{ states(''sensor.rte_tempo_couleur_actuelle_visuel'') }}'
                    secondary: Couleur du jour
                    icon: mdi:circle
                    icon_color: >
                      {% set c = states('sensor.rte_tempo_couleur_actuelle') |
                      lower %} {% if 'rouge' in c %}red{% elif 'blanc' in c
                      %}white{% else %}blue{% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          {% set c = states('sensor.rte_tempo_couleur_actuelle') | lower %}
                          {% if 'rouge' in c %}
                            background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                          {% elif 'blanc' in c %}
                            background: rgba(255, 255, 255, 0.1); border-left: 4px solid #FFFFFF;
                          {% else %}
                            background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                          {% endif %}
                        }
                  - type: custom:mushroom-template-card
                    entity: sensor.rte_tempo_prochaine_couleur_visuel
                    primary: '{{ states(''sensor.rte_tempo_prochaine_couleur_visuel'') }}'
                    secondary: Demain
                    icon: mdi:circle
                    icon_color: >
                      {% set c = states('sensor.rte_tempo_prochaine_couleur') |
                      lower %} {% if 'rouge' in c %}red{% elif 'blanc' in c
                      %}white{% else %}blue{% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          {% set c = states('sensor.rte_tempo_prochaine_couleur') | lower %}
                          {% if 'rouge' in c %}
                            background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                          {% elif 'blanc' in c %}
                            background: rgba(255, 255, 255, 0.1); border-left: 4px solid #FFFFFF;
                          {% else %}
                            background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                          {% endif %}
                        }
  - title: État Planning
    path: etat-planning
    icon: mdi:information-variant-box-outline
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr
          grid-gap: 12px
          margin: 0
          padding: 12px
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🎯 Mode Actif
                subtitle: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}
                    🛫 Vacances (Absence) • {{ states('input_number.temp_vacances') }}°C
                  {% elif is_state('input_boolean.chauffage_manuel', 'on') %}
                    ✋ Manuel • {{ states('input_number.temp_consigne_manuelle') }}°C
                  {% elif is_state('input_boolean.boost_temperature', 'on') %}
                    🔥 Boost • {{ states('input_number.temp_consigne_active') }}°C
                  {% elif is_state('input_boolean.mode_planning_teletravail',
                  'on') %}
                    💼 Télétravail • {{ states('input_number.temp_consigne_active') }}°C
                  {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}
                    🏖️ Vacances Maison • {{ states('input_number.temp_consigne_active') }}°C
                  {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}
                    🎉 Weekend Prolongé • {{ states('input_number.temp_consigne_active') }}°C
                  {% else %}
                    📅 Planning Normal • {{ states('input_number.temp_consigne_active') }}°C
                  {% endif %}
              - type: custom:mushroom-template-card
                entity: input_number.temp_consigne_active
                primary: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}🛫 MODE
                  VACANCES (Absence) {% elif
                  is_state('input_boolean.chauffage_manuel', 'on') %}✋ MODE
                  MANUEL {% elif is_state('input_boolean.boost_temperature',
                  'on') %}🔥 MODE BOOST {% elif
                  is_state('input_boolean.mode_planning_teletravail', 'on') %}💼
                  PLANNING TÉLÉTRAVAIL {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}🏖️ VACANCES MAISON {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}🎉 WEEKEND PROLONGÉ {% else %}📅 PLANNING NORMAL{% endif %}
                secondary: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}
                    Hors-gel {{ states('input_number.temp_vacances') }}°C • Fin {{ as_timestamp(states('input_datetime.vacances_fin')) | timestamp_custom('%d/%m à %H:%M') }}
                  {% elif is_state('input_boolean.chauffage_manuel', 'on') %}
                    Consigne {{ states('input_number.temp_consigne_manuelle') }}°C • Jusqu'à désactivation
                  {% elif is_state('input_boolean.boost_temperature', 'on') %}
                    +{{ states('input_number.boost_temperature_supplementaire') }}°C → {{ states('input_number.temp_consigne_active') }}°C • Fin {{ as_timestamp(states('input_datetime.boost_fin')) | timestamp_custom('%H:%M') }}
                  {% elif is_state('input_boolean.mode_planning_teletravail',
                  'on') %}
                    Fin {{ as_timestamp(states('input_datetime.teletravail_fin')) | timestamp_custom('%d/%m/%Y') }}
                  {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}
                    Fin {{ as_timestamp(states('input_datetime.vacances_maison_fin')) | timestamp_custom('%d/%m/%Y') }}
                  {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}
                    Fin {{ as_timestamp(states('input_datetime.weekend_prolonge_fin')) | timestamp_custom('%d/%m/%Y') }}
                  {% else %}
                    {% if is_state('schedule.chauffage_semaine_matin', 'on') %}🌅 Période Confort Matin
                    {% elif is_state('schedule.chauffage_semaine_soir', 'on') %}🌆 Période Confort Soir
                    {% elif is_state('schedule.chauffage_weekend', 'on') %}🎈 Période Confort Weekend
                    {% else %}💚 Mode Éco{% endif %}
                  {% endif %}
                icon: >
                  {% if is_state('input_boolean.mode_vacances', 'on')
                  %}mdi:airplane-takeoff {% elif
                  is_state('input_boolean.chauffage_manuel', 'on')
                  %}mdi:hand-back-right {% elif
                  is_state('input_boolean.boost_temperature', 'on')
                  %}mdi:fire-alert {% elif
                  is_state('input_boolean.mode_planning_teletravail', 'on')
                  %}mdi:laptop {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}mdi:home-heart {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}mdi:party-popper {% else %}mdi:calendar-check{% endif %}
                icon_color: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}blue {%
                  elif is_state('input_boolean.chauffage_manuel', 'on') %}orange
                  {% elif is_state('input_boolean.boost_temperature', 'on')
                  %}red {% elif
                  is_state('input_boolean.mode_planning_teletravail', 'on')
                  %}teal {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}pink {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}purple {% else %}green{% endif %}
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_boolean.mode_vacances', 'on') %}
                        background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                      {% elif is_state('input_boolean.chauffage_manuel', 'on') %}
                        background: rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800;
                      {% elif is_state('input_boolean.boost_temperature', 'on') %}
                        background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                      {% elif is_state('input_boolean.mode_planning_teletravail', 'on') %}
                        background: rgba(0, 150, 136, 0.1); border-left: 4px solid #009688;
                      {% elif is_state('input_boolean.mode_planning_vacances_maison', 'on') %}
                        background: rgba(233, 30, 99, 0.1); border-left: 4px solid #E91E63;
                      {% elif is_state('input_boolean.mode_planning_weekend_prolonge', 'on') %}
                        background: rgba(156, 39, 176, 0.1); border-left: 4px solid #9C27B0;
                      {% else %}
                        background: rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50;
                      {% endif %}
                      transition: all 0.3s ease;
                    }
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: input_boolean.mode_planning_normal
                    name: Normal
                    icon: mdi:calendar-check
                    color: green
                    tap_action:
                      action: call-service
                      service: script.planning_mode_normal
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_planning_teletravail
                    name: Télétravail
                    icon: mdi:laptop
                    color: teal
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_planning_vacances_maison
                    name: Vac. Maison
                    icon: mdi:home-heart
                    color: pink
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_planning_weekend_prolonge
                    name: Weekend+
                    icon: mdi:calendar-weekend
                    color: purple
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_vacances
                    name: Vacances
                    icon: mdi:airplane-takeoff
                    color: blue
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: tile
                    entity: script.reinitialiser_tous_plannings
                    name: Réinitialiser
                    icon: mdi:restart-alert
                    color: red
                    tap_action:
                      action: call-service
                      service: script.reinitialiser_tous_plannings
                      data: {}
                      confirmation:
                        text: >-
                          Voulez-vous vraiment réinitialiser tous les plannings
                          ?
                    card_mod:
                      style: |
                        ha-card {
                          --tile-color: #f44336 !important;
                          background: rgba(244, 67, 54, 0.2) !important;
                        }
              - type: markdown
                content: >
                  ---

                  Priorisation des Planning 📈

                  1. 🛫Vacances → 2. ✋Manuel → 3. 🔥Boost → 4. 💼Télétravail →
                  5. 🏖️Vac. Maison → 6. 🎉Weekend+ → 7. 📅Planning Normal → 8.
                  💚Éco
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.03);
                      border: 1px solid rgba(255, 255, 255, 0.1);
                      border-radius: 12px;
                    }
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 📋 Détails du Planning
              - type: markdown
                content: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}

                  #### 🌡️ Températures - **Température unique** : {{
                  states('input_number.temp_vacances') }}°C - **Mode** :
                  Hors-gel / Absence prolongée

                  #### 📅 Période - **Début** : {{
                  as_timestamp(states('input_datetime.vacances_debut')) |
                  timestamp_custom('%d/%m/%Y à %H:%M') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.vacances_fin')) |
                  timestamp_custom('%d/%m/%Y à %H:%M') }}

                  --- ⚠️ **Priorité absolue** : Tous les autres modes sont
                  désactivés

                  {% elif is_state('input_boolean.chauffage_manuel', 'on') %}

                  #### 🌡️ Température - **Consigne manuelle** : {{
                  states('input_number.temp_consigne_manuelle') }}°C -
                  **Contrôle** : Total utilisateur

                  #### ⏱️ Durée - **Actif** : Jusqu'à désactivation manuelle -
                  **Retour auto** : Aux changements de plage horaire du planning
                  normal

                  {% elif is_state('input_boolean.boost_temperature', 'on') %}

                  #### 🌡️ Températures - **Base** : {{
                  states('input_number.temp_confort') if
                  is_state('schedule.chauffage_semaine_matin', 'on') or
                  is_state('schedule.chauffage_semaine_soir', 'on') or
                  is_state('schedule.chauffage_weekend', 'on') else
                  states('input_number.temp_eco') }}°C - **Boost** : +{{
                  states('input_number.boost_temperature_supplementaire') }}°C -
                  **Total** : {{ states('input_number.temp_consigne_active')
                  }}°C

                  #### ⏱️ Durée - **Début** : {{
                  (as_timestamp(states('input_datetime.boost_fin')) -
                  (states('input_number.boost_duree')|float * 3600)) |
                  timestamp_custom('%H:%M') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.boost_fin')) |
                  timestamp_custom('%H:%M') }} - **Restant** : {{
                  ((as_timestamp(states('input_datetime.boost_fin')) -
                  now().timestamp()) / 60) | round(0) }} min

                  {% elif is_state('input_boolean.mode_planning_teletravail',
                  'on') %}

                  #### 🌡️ Températures - **Confort** : {{
                  states('input_number.temp_confort') }}°C - **Éco** : {{
