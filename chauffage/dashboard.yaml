views:
  - title: Chauffage
    path: chauffage-principal
    icon: mdi:radiator
    panel: true
    theme: Backend-selected=default
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr 1fr
          grid-gap: 12px
          margin: 0
          padding: 12px
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🌡️ Chauffage
                subtitle: >
                  {{ states('sensor.temperature_rdc_corrigee') }}°C → {{
                  states('input_number.temp_consigne_active') }}°C
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.temperature_rdc_corrigee
                    primary: '{{ states(''sensor.temperature_rdc_corrigee'') }}°C'
                    secondary: Température actuelle
                    icon: mdi:thermometer
                    icon_color: >
                      {% set temp = states('sensor.temperature_rdc_corrigee') |
                      float(0) %} {% set consigne =
                      states('input_number.temp_consigne_active') | float(0) %}
                      {% if temp >= consigne %}green {% elif temp >= consigne -
                      1 %}orange {% else %}red{% endif %}
                    badge_icon: mdi:home-thermometer
                    badge_color: >
                      {% set temp = states('sensor.temperature_rdc_corrigee') |
                      float(0) %} {% set consigne =
                      states('input_number.temp_consigne_active') | float(0) %}
                      {% if temp >= consigne %}green{% else %}orange{% endif %}
                    tap_action:
                      action: more-info
                    card_mod:
                      style: >
                        ha-card {
                          {% set temp = states('sensor.temperature_rdc_corrigee') | float(0) %}
                          {% set consigne = states('input_number.temp_consigne_active') | float(0) %}
                          {% if temp >= consigne %}
                            background: rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50;
                          {% elif temp >= consigne - 1 %}
                            background: rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800;
                          {% else %}
                            background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                          {% endif %}
                          transition: all 0.3s ease;
                        }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
                  - type: custom:mushroom-template-card
                    entity: input_number.temp_consigne_active
                    primary: '{{ states(''input_number.temp_consigne_active'') }}°C'
                    secondary: Consigne active
                    icon: mdi:target
                    icon_color: blue
                    badge_icon: mdi:bullseye-arrow
                    badge_color: blue
                    tap_action:
                      action: more-info
                    card_mod:
                      style: >
                        ha-card {
                          background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                          transition: all 0.3s ease;
                        }

                        ha-card:hover { transform: translateY(-2px); box-shadow:
                        0 4px 8px rgba(0,0,0,0.2); }
              - type: conditional
                conditions:
                  - entity: input_boolean.chauffage_actif
                    state: 'on'
                card:
                  type: custom:mushroom-template-card
                  entity: input_boolean.chauffage_actif
                  primary: 🔥 Poêle ALLUMÉ
                  secondary: ''
                  icon: mdi:fire
                  icon_color: deep-orange
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 87, 34, 0.15); border-left: 4px solid #FF9800;
                      }
              - type: conditional
                conditions:
                  - entity: input_boolean.chauffage_actif
                    state: 'off'
                card:
                  type: custom:mushroom-template-card
                  entity: input_boolean.chauffage_actif
                  primary: ❄️ Poêle ÉTEINT
                  secondary: ''
                  icon: mdi:snowflake
                  icon_color: light-blue
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(3, 169, 244, 0.1); border-left: 4px solid #F44336;
                      }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:home
                    content: Accueil
                    icon_color: blue
                    tap_action:
                      action: navigate
                      navigation_path: /dashboard-accueil/home
                  - type: template
                    icon: >
                      {% if is_state('input_boolean.mode_vacances', 'on')
                      %}mdi:airplane {% elif
                      is_state('input_boolean.chauffage_manuel', 'on')
                      %}mdi:hand-back-right {% elif
                      is_state('input_boolean.boost_temperature', 'on')
                      %}mdi:fire-alert {% elif
                      is_state('input_boolean.mode_planning_teletravail', 'on')
                      %}mdi:laptop {% elif
                      is_state('input_boolean.mode_planning_vacances_maison',
                      'on') %}mdi:home-heart {% elif
                      is_state('input_boolean.mode_planning_weekend_prolonge',
                      'on') %}mdi:party-popper {% else %}mdi:calendar-check{%
                      endif %}
                    content: >
                      {% if is_state('input_boolean.mode_vacances', 'on') %}Mode
                      Vacances {% elif
                      is_state('input_boolean.chauffage_manuel', 'on') %}Mode
                      Manuel {% elif is_state('input_boolean.boost_temperature',
                      'on') %}Mode Boost {% elif
                      is_state('input_boolean.mode_planning_teletravail', 'on')
                      %}Mode Télétravail {% elif
                      is_state('input_boolean.mode_planning_vacances_maison',
                      'on') %}Vacances Maison {% elif
                      is_state('input_boolean.mode_planning_weekend_prolonge',
                      'on') %}Weekend Prolongé {% else %}Planning Normal{% endif
                      %}
                    icon_color: >
                      {% if is_state('input_boolean.mode_vacances', 'on') %}blue
                      {% elif is_state('input_boolean.chauffage_manuel', 'on')
                      %}orange {% elif
                      is_state('input_boolean.boost_temperature', 'on') %}red {%
                      elif is_state('input_boolean.mode_planning_teletravail',
                      'on') %}teal {% elif
                      is_state('input_boolean.mode_planning_vacances_maison',
                      'on') %}pink {% elif
                      is_state('input_boolean.mode_planning_weekend_prolonge',
                      'on') %}purple {% else %}green{% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          animation: pulse 2s ease-in-out infinite;
                        }
                        @keyframes pulse {
                          0%, 100% { opacity: 1; }
                          50% { opacity: 0.6; }
                        }
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: ✋ Contrôle Manuel
              - type: custom:mushroom-entity-card
                entity: input_boolean.chauffage_manuel
                name: Mode Manuel
                icon: mdi:hand-back-right
                icon_color: >
                  {% if is_state('input_boolean.chauffage_manuel', 'on')
                  %}orange{% else %}grey{% endif %}
                badge_icon: >
                  {% if is_state('input_boolean.chauffage_manuel', 'on')
                  %}mdi:check-bold{% else %}mdi:close-thick{% endif %}
                badge_color: >
                  {% if is_state('input_boolean.chauffage_manuel', 'on')
                  %}orange{% else %}grey{% endif %}
                tap_action:
                  action: toggle
                  haptic: medium
                card_mod:
                  style: >
                    ha-card {
                      {% if is_state('input_boolean.chauffage_manuel', 'on') %}
                        background: rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800;
                      {% else %}
                        background: rgba(255, 255, 255, 0.03); border-left: 4px solid #757575;
                      {% endif %}
                      transition: all 0.3s ease;
                    }

                    ha-card:hover { transform: translateY(-2px); box-shadow: 0
                    4px 8px rgba(0,0,0,0.2); }
              - type: conditional
                conditions:
                  - entity: input_boolean.chauffage_manuel
                    state: 'on'
                card:
                  type: custom:mushroom-number-card
                  entity: input_number.temp_consigne_manuelle
                  name: Consigne Manuelle
                  icon: mdi:thermometer-lines
                  icon_color: orange
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🔥 Boost Température
              - type: custom:mushroom-entity-card
                entity: input_boolean.boost_temperature
                name: Mode Boost
                icon: mdi:fire-alert
                icon_color: >
                  {% if is_state('input_boolean.boost_temperature', 'on')
                  %}red{% else %}grey{% endif %}
                badge_icon: >
                  {% if is_state('input_boolean.boost_temperature', 'on')
                  %}mdi:check-bold{% else %}mdi:close-thick{% endif %}
                badge_color: >
                  {% if is_state('input_boolean.boost_temperature', 'on')
                  %}red{% else %}grey{% endif %}
                tap_action:
                  action: toggle
                  haptic: medium
                card_mod:
                  style: >
                    ha-card {
                      {% if is_state('input_boolean.boost_temperature', 'on') %}
                        background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                      {% else %}
                        background: rgba(255, 255, 255, 0.03); border-left: 4px solid #757575;
                      {% endif %}
                      transition: all 0.3s ease;
                    }

                    ha-card:hover { transform: translateY(-2px); box-shadow: 0
                    4px 8px rgba(0,0,0,0.2); }
              - type: conditional
                conditions:
                  - entity: input_boolean.boost_temperature
                    state: 'on'
                card:
                  type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-number-card
                      entity: input_number.boost_temperature_supplementaire
                      name: +°C
                      icon: mdi:thermometer-plus
                      icon_color: red
                    - type: custom:mushroom-number-card
                      entity: input_number.boost_duree
                      name: Durée (h)
                      icon: mdi:timer-sand
                      icon_color: red
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🔵⚪🔴 EDF Tempo
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.rte_tempo_couleur_actuelle_visuel
                    primary: '{{ states(''sensor.rte_tempo_couleur_actuelle_visuel'') }}'
                    secondary: Couleur du jour
                    icon: mdi:circle
                    icon_color: >
                      {% set c = states('sensor.rte_tempo_couleur_actuelle') |
                      lower %} {% if 'rouge' in c %}red{% elif 'blanc' in c
                      %}white{% else %}blue{% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          {% set c = states('sensor.rte_tempo_couleur_actuelle') | lower %}
                          {% if 'rouge' in c %}
                            background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                          {% elif 'blanc' in c %}
                            background: rgba(255, 255, 255, 0.1); border-left: 4px solid #FFFFFF;
                          {% else %}
                            background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                          {% endif %}
                        }
                  - type: custom:mushroom-template-card
                    entity: sensor.rte_tempo_prochaine_couleur_visuel
                    primary: '{{ states(''sensor.rte_tempo_prochaine_couleur_visuel'') }}'
                    secondary: Demain
                    icon: mdi:circle
                    icon_color: >
                      {% set c = states('sensor.rte_tempo_prochaine_couleur') |
                      lower %} {% if 'rouge' in c %}red{% elif 'blanc' in c
                      %}white{% else %}blue{% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          {% set c = states('sensor.rte_tempo_prochaine_couleur') | lower %}
                          {% if 'rouge' in c %}
                            background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                          {% elif 'blanc' in c %}
                            background: rgba(255, 255, 255, 0.1); border-left: 4px solid #FFFFFF;
                          {% else %}
                            background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                          {% endif %}
                        }
  - title: Historique
    path: historique
    icon: mdi:chart-line
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-template-rows: 70% 30%
          margin: 0
          padding: 12px
          grid-gap: 12px
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 📊 Historique
                subtitle: Température, consigne et état du chauffage
              - type: custom:mini-graph-card
                name: Température & Consigne (24h)
                entities:
                  - entity: sensor.temperature_rdc_corrigee
                    name: Tempé RDC
                    color: '#4CAF50'
                  - entity: input_number.temp_consigne_active
                    name: Consigne
                    color: '#2196F3'
                    show_fill: false
                hours_to_show: 24
                points_per_hour: 4
                line_width: 1
                font_size: 70
                animate: true
                show:
                  fill: fade
                  icon: true
                  name: true
                  state: true
                  labels: true
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(33, 150, 243, 0.05);
                      border: 1px solid rgba(33, 150, 243, 0.2);
                      transition: all 0.3s ease;
                    }
                    ha-card:hover {
                      background: rgba(33, 150, 243, 0.1);
                      transform: translateY(-2px);
                      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
                    }
          - type: history-graph
            title: 🔥 État Poêle (24h)
            entities:
              - entity: input_boolean.chauffage_actif
                name: Poêle
            hours_to_show: 24
  - title: Mode Saisonnier & Consignes
    path: mode-saisonnier
    icon: mdi:weather-sunny
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: ☀️❄️ Mode Saisonnier
            subtitle: |
              {% if is_state('input_boolean.chauffage_desactive_ete', 'on') %}
                Mode Été • Chauffage complètement désactivé
              {% else %}
                Mode Hiver • Chauffage actif selon les plannings
              {% endif %}
          - type: conditional
            conditions:
              - entity: input_boolean.chauffage_desactive_ete
                state: 'on'
            card:
              type: custom:mushroom-template-card
              primary: ☀️ MODE ÉTÉ ACTIVÉ
              secondary: >-
                Le chauffage est complètement désactivé. Toute tentative
                d'activation sera automatiquement bloquée.
              icon: mdi:white-balance-sunny
              icon_color: amber
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(253, 184, 19, 0.2) 0%, rgba(243, 115, 53, 0.2) 100%);
                    border-left: 4px solid #FDB813;
                  }
          - type: conditional
            conditions:
              - entity: input_boolean.chauffage_desactive_ete
                state: 'off'
            card:
              type: custom:mushroom-template-card
              primary: ❄️ MODE HIVER ACTIVÉ
              secondary: Le chauffage fonctionne normalement selon les plannings.
              icon: mdi:snowflake
              icon_color: indigo
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
                    border-left: 4px solid #667eea;
                  }
          - type: custom:mushroom-entity-card
            entity: input_boolean.chauffage_desactive_ete
            name: Désactiver le Chauffage (Été)
            icon: mdi:power
            icon_color: >
              {% if is_state('input_boolean.chauffage_desactive_ete', 'on')
              %}amber{% else %}indigo{% endif %}
            badge_icon: >
              {% if is_state('input_boolean.chauffage_desactive_ete', 'on')
              %}mdi:power-off{% else %}mdi:power{% endif %}
            badge_color: >
              {% if is_state('input_boolean.chauffage_desactive_ete', 'on')
              %}amber{% else %}indigo{% endif %}
            tap_action:
              action: toggle
              haptic: medium
            card_mod:
              style: >
                ha-card {
                  {% if is_state('input_boolean.chauffage_desactive_ete', 'on') %}
                    background: rgba(255, 193, 7, 0.1); border-left: 4px solid #FFC107;
                  {% else %}
                    background: rgba(63, 81, 181, 0.1); border-left: 4px solid #3F51B5;
                  {% endif %}
                  transition: all 0.3s ease;
                }

                ha-card:hover { transform: translateY(-2px); box-shadow: 0 4px
                8px rgba(0,0,0,0.2); }
          - type: conditional
            conditions:
              - entity: input_boolean.chauffage_actif
                state: 'on'
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.chauffage_actif
              primary: 🔥 État Chauffage — ACTIVÉ
              secondary: ''
              icon: mdi:fire
              icon_color: green
              card_mod:
                style: >
                  ha-card { background: rgba(76, 175, 80, 0.1); border-left: 4px
                  solid #4CAF50; }
          - type: conditional
            conditions:
              - entity: input_boolean.chauffage_actif
                state: 'off'
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.chauffage_actif
              primary: ❄️ État Chauffage — DÉSACTIVÉ
              secondary: ''
              icon: mdi:snowflake
              icon_color: red
              card_mod:
                style: >
                  ha-card { background: rgba(244, 67, 54, 0.1); border-left: 4px
                  solid #F44336; }
          - type: custom:mushroom-title-card
            title: 🌡️ Températures
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: input_number.temp_confort
                name: Température Confort
                icon: mdi:thermometer-high
                icon_color: deep-orange
                card_mod:
                  style: >
                    ha-card {
                      background: rgba(255, 87, 34, 0.1); border: 1px solid rgba(255, 87, 34, 0.3);
                      transition: all 0.3s ease;
                    }

                    ha-card:hover { background: rgba(255, 87, 34, 0.15);
                    transform: scale(1.02); }
              - type: custom:mushroom-number-card
                entity: input_number.temp_eco
                name: Température Éco
                icon: mdi:thermometer-low
                icon_color: green
                card_mod:
                  style: >
                    ha-card {
                      background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3);
                      transition: all 0.3s ease;
                    }

                    ha-card:hover { background: rgba(76, 175, 80, 0.15);
                    transform: scale(1.02); }
  - title: Climatisation
    path: climatisation
    icon: mdi:air-conditioner
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-template-rows: auto auto auto
          grid-gap: 12px
          margin: 0
          padding: 12px
        cards:
          - type: vertical-stack
            view_layout:
              grid-column: 1 / -1
            cards:
              - type: custom:mushroom-title-card
                title: ❄️ Climatisation
                subtitle: >
                  {% if is_state('input_boolean.chauffage_desactive_ete', 'on')
                  %}
                    ☀️ Mode Été • Toutes les clims en COOL
                  {% else %}
                    ❄️ Mode Hiver • Toutes les clims en HEAT
                  {% endif %}
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Tout allumer
                    icon: mdi:power
                    icon_color: green
                    layout: horizontal
                    tap_action:
                      action: call-service
                      service: climate.turn_on
                      target:
                        entity_id:
                          - climate.clim_salon
                          - climate.clim_chambre_parents
                          - climate.clim_chambre_theodore
                          - climate.clim_chambre_antonin
                          - climate.clim_chambre_maxence
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(76, 175, 80, 0.1);
                          border-left: 4px solid #4CAF50;
                          cursor: pointer;
                        }
                  - type: custom:mushroom-template-card
                    primary: Tout éteindre
                    icon: mdi:power-off
                    icon_color: red
                    layout: horizontal
                    tap_action:
                      action: call-service
                      service: climate.turn_off
                      target:
                        entity_id:
                          - climate.clim_salon
                          - climate.clim_chambre_parents
                          - climate.clim_chambre_theodore
                          - climate.clim_chambre_antonin
                          - climate.clim_chambre_maxence
                      confirmation:
                        text: Éteindre toutes les clims ?
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(244, 67, 54, 0.1);
                          border-left: 4px solid #F44336;
                          cursor: pointer;
                        }
                  - type: custom:mushroom-template-card
                    primary: >
                      {% if is_state('input_boolean.chauffage_desactive_ete',
                      'on') %}
                        ☀️ Mode Été
                      {% else %}
                        ❄️ Mode Hiver
                      {% endif %}
                    secondary: Changer dans Mode Saisonnier
                    icon: >
                      {% if is_state('input_boolean.chauffage_desactive_ete',
                      'on') %}
                        mdi:white-balance-sunny
                      {% else %}
                        mdi:snowflake
                      {% endif %}
                    icon_color: >
                      {% if is_state('input_boolean.chauffage_desactive_ete',
                      'on') %}
                        amber
                      {% else %}
                        indigo
                      {% endif %}
                    layout: horizontal
                    tap_action:
                      action: navigate
                      navigation_path: /chauffage-v2/mode-saisonnier
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.chauffage_desactive_ete', 'on') %}
                            background: rgba(255, 193, 7, 0.1); border-left: 4px solid #FFC107;
                          {% else %}
                            background: rgba(63, 81, 181, 0.1); border-left: 4px solid #3F51B5;
                          {% endif %}
                          cursor: pointer;
                        }
          - type: vertical-stack
            view_layout:
              grid-column: 1 / -1
            cards:
              - type: custom:mushroom-title-card
                title: 🏠 RDC
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Clim Salon
                    secondary: >
                      {# ← Remplacer climate.clim_salon par le vrai entity_id #}
                      {% if is_state('climate.clim_salon', 'off') %}
                        Éteinte
                      {% else %}
                        {{ state_attr('climate.clim_salon', 'current_temperature') }}°C
                        → {{ state_attr('climate.clim_salon', 'temperature') }}°C
                        • {{ state_attr('climate.clim_salon', 'hvac_action') }}
                      {% endif %}
                    icon: mdi:air-conditioner
                    icon_color: >
                      {% if is_state('climate.clim_salon', 'off') %}grey {% elif
                      state_attr('climate.clim_salon', 'hvac_mode') == 'cool'
                      %}light-blue {% else %}deep-orange{% endif %}
                    badge_icon: >
                      {% if is_state('climate.clim_salon', 'off')
                      %}mdi:power-off {% elif state_attr('climate.clim_salon',
                      'hvac_mode') == 'cool' %}mdi:snowflake {% else
                      %}mdi:fire{% endif %}
                    badge_color: >
                      {% if is_state('climate.clim_salon', 'off') %}grey {% elif
                      state_attr('climate.clim_salon', 'hvac_mode') == 'cool'
                      %}light-blue {% else %}deep-orange{% endif %}
                    tap_action:
                      action: more-info
                      entity: climate.clim_salon
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('climate.clim_salon', 'off') %}
                            background: rgba(255,255,255,0.03); border-left: 4px solid #757575;
                          {% elif state_attr('climate.clim_salon', 'hvac_mode') == 'cool' %}
                            background: rgba(3, 169, 244, 0.1); border-left: 4px solid #03A9F4;
