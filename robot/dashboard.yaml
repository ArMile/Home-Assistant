            title: 🤖 Mode CleanGenius (Automatique)
            show_header_toggle: false
            card_mod:
              style: |
                ha-card {
                  border-radius: 15px;
                  background: linear-gradient(135deg, rgba(76, 175, 80, 0.1) 0%, rgba(76, 175, 80, 0.02) 100%);
                }
            entities:
              - entity: select.x50_ultra_complete_cleangenius
                name: Mode CleanGenius
                icon: mdi:auto-fix
              - entity: select.x50_ultra_complete_cleangenius_mode
                name: Type de nettoyage
                icon: mdi:broom
          - type: entities
            title: ⚙️ Mode Personnalisé (Manuel)
            show_header_toggle: false
            card_mod:
              style: |
                ha-card {
                  border-radius: 15px;
                  background: linear-gradient(135deg, rgba(33, 150, 243, 0.1) 0%, rgba(33, 150, 243, 0.02) 100%);
                }
            entities:
              - entity: select.x50_ultra_complete_cleaning_mode
                name: Mode de nettoyage
                icon: mdi:broom
              - entity: select.x50_ultra_complete_suction_level
                name: Puissance d'aspiration
                icon: mdi:fan
              - entity: switch.x50_ultra_complete_max_suction_power
                name: Puissance maximale (boost)
                icon: mdi:lightning-bolt
              - entity: select.x50_ultra_complete_mop_pad_humidity
                name: Humidité serpillère
                icon: mdi:water-percent
              - entity: select.x50_ultra_complete_mop_extend_frequency
                name: Fréquence lavage serpillère
                icon: mdi:water-sync
              - type: divider
              - entity: select.x50_ultra_complete_self_clean_frequency
                name: Auto-nettoyage serpillère
                icon: mdi:washing-machine
              - entity: number.x50_ultra_complete_self_clean_area
                name: Surface (m²)
                icon: mdi:ruler-square
              - entity: number.x50_ultra_complete_self_clean_time
                name: Temps (minutes)
                icon: mdi:timer-outline
              - type: divider
              - entity: select.x50_ultra_complete_cleaning_route
                name: Itinéraire
                icon: mdi:map-marker-path
  - title: Pièces
    icon: mdi:floor-plan
    path: rooms
    cards:
      - type: custom:xiaomi-vacuum-map-card
        entity: vacuum.x50_ultra_complete
        map_source:
          camera: camera.x50_ultra_complete_map
        calibration_source:
          camera: true
        title: RDC Vennecy
        map_modes:
          - template: vacuum_clean_segment
            predefined_selections:
              - id: 1
                label:
                  text: Meeting Room
                  x: 5025
                  'y': 6675
                  offset_y: 35
                icon:
                  name: mdi:presentation
                  x: 5025
                  'y': 6675
              - id: 2
                label:
                  text: Kitchen
                  x: 5775
                  'y': 2875
                  offset_y: 35
                icon:
                  name: mdi:chef-hat
                  x: 5775
                  'y': 2875
              - id: 3
                label:
                  text: Bathroom
                  x: 7575
                  'y': -425
                  offset_y: 35
                icon:
                  name: mdi:toilet
                  x: 7575
                  'y': -425
              - id: 4
                label:
                  text: Office
                  x: 6925
                  'y': -3025
                  offset_y: 35
                icon:
                  name: mdi:monitor-shimmer
                  x: 6925
                  'y': -3025
              - id: 5
                label:
                  text: Living Room
                  x: 2175
                  'y': -1975
                  offset_y: 35
                icon:
                  name: mdi:sofa-outline
                  x: 2175
                  'y': -1975
              - id: 6
                label:
                  text: Dining Hall
                  x: 1275
                  'y': 2225
                  offset_y: 35
                icon:
                  name: mdi:room-service-outline
                  x: 1275
                  'y': 2225
          - template: vacuum_clean_zone
