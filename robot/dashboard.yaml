                        service_data:
                          piece: dining_hall
                      styles:
                        card:
                          - height: 55px
                          - padding: 8px
                          - border-radius: 12px
                          - background: >
                              [[[ return entity.state > 0 ? 'var(--green-color)'
                              : 'var(--card-background-color)'; ]]]
                        icon:
                          - width: 22px
                        name:
                          - font-size: 13px
