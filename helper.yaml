# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Fichiers externes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include sensors.yaml

# ============================================================
# 1. PARAMETRES GENERAUX
# ============================================================

# ------------------------------------------------------------
# 1.1 Localisation (me sert à affiner valeur sun.sun par rapport à ma position exacte)
# ------------------------------------------------------------
homeassistant:
  latitude: 4x.xxxxxx  # Votre lieu de résidence
  longitude: 2.05
  elevation: 116  # Mètres au-dessus du niveau de la mer
  time_zone: Europe/Paris
  unit_system: metric
  currency: EUR

# ------------------------------------------------------------
# 1.2 Notifications SMTP
# ------------------------------------------------------------
notify:
  - name: "ha_email"
    platform: smtp
    server: "smtp.gmail.com"
    port: 587
    timeout: 15
    sender: "votre.email@gmail.com"
    encryption: starttls
    username: "votre.email.expéditeur@gmail.com"
    password: !secret gmail_password  
    recipient:
      - "votre.email.destinaitaire@gmail.com"
    sender_name: "Home Assistant"

# ------------------------------------------------------------
# 1.3 Reverse Proxy
# ------------------------------------------------------------
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.xxx.xxx    # Gateway du VLAN HA
    - 192.168.xxx.xxx   # IP de gestion Firewall/Reverse Proxy
  ip_ban_enabled: true
  login_attempts_threshold: 5

# ------------------------------------------------------------
# 1.4 Systeme Musical Sonos
# ------------------------------------------------------------
sonos:
  media_player:
    advertise_addr: 192.168.xxx.xxx   # IP de Home Assistant joignable depuis le VLAN Sonos
    hosts:
      - 192.168.xxx.xxx               # IP Sonos Play:1 SaM
      - 192.168.xxx.xxx               # IP Sonos Play:1 SaM
      - 192.168.xxx.xxx               # IP Sonos Roam Portable

