# 15. BUREAU MAXENCE
# ============================================================
# ============================================================
# BUREAU MAXENCE - AUTOMATIONS
# ============================================================

# ============================================================
# TRACES (Historique allumage/extinction/coupure)
# ============================================================

# 1. Trace allumage (> 30W pendant 2 min)
- id: bureau_maxence_trace_allumage
  alias: "Bureau Maxence - Trace allumage"
  description: "Enregistre l'heure d'allumage du bureau"
  trigger:
    - platform: numeric_state
      entity_id: sensor.bureau_maxence_power
      above: 30
      for:
        minutes: 2
  condition:
    - condition: template
      value_template: >
        {% set last_changed = as_timestamp(states.input_datetime.bureau_maxence_last_on.last_changed) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since = ((now_ts - last_changed) / 60) | int %}
        {{ minutes_since > 15 }}
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.bureau_maxence_last_on
      data:
        datetime: "{{ now() }}"

# 2. Trace extinction (< 30W pendant 1 min)
- id: bureau_maxence_trace_extinction
  alias: "Bureau Maxence - Trace extinction"
  description: "Enregistre l'heure d'extinction du bureau"
  trigger:
    - platform: numeric_state
      entity_id: sensor.bureau_maxence_power
      below: 30
      for:
        minutes: 1
  condition:
    - condition: template
      value_template: >
