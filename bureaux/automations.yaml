# 14. BUREAU ARNAUD
# ============================================================
# ============================================================
# AUTOMATIONS BUREAU ARNAUD - VERSION COMPLÈTE
# ============================================================

# ------------------------------------------------------------
# TRACES : Enregistrement allumage/extinction/coupure
# ------------------------------------------------------------

# 1. Trace allumage bureau
- id: bureau_arnaud_trace_allumage
  alias: "Bureau Arnaud - Trace allumage"
  description: "Enregistre l'heure d'allumage du bureau"
  trigger:
    - platform: numeric_state
      entity_id: sensor.bureau_arnaud_power
      above: 30
      for:
        minutes: 2
  condition:
    - condition: template
      value_template: >
        {% set last_changed = as_timestamp(states.input_datetime.bureau_arnaud_last_on.last_changed) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since = ((now_ts - last_changed) / 60) | int %}
        {{ minutes_since > 15 }}
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.bureau_arnaud_last_on
      data:
        datetime: "{{ now() }}"

# 2. Trace extinction bureau
- id: bureau_arnaud_trace_extinction
  alias: "Bureau Arnaud - Trace extinction"
  description: "Enregistre l'heure d'extinction du bureau"
  trigger:
    - platform: numeric_state
      entity_id: sensor.bureau_arnaud_power
      below: 30
      for:
        minutes: 1
  condition:
    - condition: template
      value_template: >
        {% set last_changed = as_timestamp(states.input_datetime.bureau_arnaud_last_off.last_changed) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since = ((now_ts - last_changed) / 60) | int %}
        {{ minutes_since > 15 }}
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.bureau_arnaud_last_off
      data:
        datetime: "{{ now() }}"

# 3. Trace coupure switch
- id: bureau_arnaud_trace_coupure_switch
  alias: "Bureau Arnaud - Trace coupure switch"
  description: "Enregistre toutes les coupures du switch"
  trigger:
    - platform: state
      entity_id: switch.bureau_arnaud
      to: "off"
      from: "on"
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.bureau_arnaud_last_switch_off
      data:
        datetime: "{{ now() }}"

# ------------------------------------------------------------
# COUPURE AUTOMATIQUE
# ------------------------------------------------------------

# 4. Coupure automatique (30 min après extinction si heure limite dépassée)
- id: bureau_arnaud_coupure_automatique
  alias: "Bureau Arnaud - Coupure automatique"
  description: "Coupe le bureau 30 min après extinction si heure limite dépassée"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    # Condition 1 : Coupure auto activée
    - condition: state
      entity_id: input_boolean.bureau_arnaud_auto_coupure
      state: "on"
    
    # Condition 2 : Switch ON
    - condition: state
      entity_id: switch.bureau_arnaud
      state: "on"
    
    # Condition 3 : Pas mode vacances
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "off"
    
    # Condition 4 : Bureau éteint (< 30W)
    - condition: numeric_state
      entity_id: sensor.bureau_arnaud_power
      below: 30
    
    # Condition 5 : Extinction depuis au moins 30 min
    - condition: template
      value_template: >
        {% set last_off = as_timestamp(states('input_datetime.bureau_arnaud_last_off')) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since = ((now_ts - last_off) / 60) | int %}
        {{ minutes_since >= 30 }}
    
    # Condition 6 : Heure limite dépassée (AVEC GESTION MINUIT)
    - condition: template
      value_template: >
        {% set jour_semaine = now().weekday() %}
        {% set est_ferie = is_state('calendar.jours_feries_en_france', 'on') %}
        {% set est_weekend_coupure = (jour_semaine in [4, 5, 6]) or est_ferie %}
        
        {% if est_weekend_coupure %}
          {% set heure_limite_str = states('input_datetime.bureau_arnaud_heure_limite_weekend') %}
        {% else %}
          {% set heure_limite_str = states('input_datetime.bureau_arnaud_heure_limite_semaine') %}
        {% endif %}
        
        {% set heure_parts = heure_limite_str.split(':') %}
        {% set heure_limite_minutes = heure_parts[0]|int * 60 + heure_parts[1]|int %}
        {% set heure_actuelle = now().hour * 60 + now().minute %}
        
        {# Si on est après minuit (00:00-05:59), considérer qu'on est après la limite de la veille #}
        {% if heure_actuelle < 360 %}
          true
        {% else %}
          {{ heure_actuelle >= heure_limite_minutes }}
        {% endif %}
    
    # Condition 7 : PAS DE RALLUMAGE RÉCENT (au moins 10 min)
    - condition: template
      value_template: >
        {% set switch_last_changed = as_timestamp(states.switch.bureau_arnaud.last_changed) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since_change = ((now_ts - switch_last_changed) / 60) | int %}
        {{ minutes_since_change > 10 }}
    
    # Condition 8 : PAS DANS PLAGE ACTIVE (Mode Normal semaine uniquement)
    - condition: template
      value_template: >
        {% set now_hour = now().hour %}
        {% set now_minute = now().minute %}
        {% set heure_actuelle = now_hour * 60 + now_minute %}
        {% set jour_semaine = now().weekday() %}
        {% set est_ferie = is_state('calendar.jours_feries_en_france', 'on') %}
        {% set est_weekend = (jour_semaine in [5, 6]) or est_ferie %}
        
        {% set mode_normal = is_state('input_boolean.chauffage_manuel', 'off') 
                         and is_state('input_boolean.mode_vacances', 'off')
                         and is_state('input_boolean.mode_planning_teletravail', 'off')
                         and is_state('input_boolean.mode_planning_vacances_maison', 'off')
                         and is_state('input_boolean.mode_planning_weekend_prolonge', 'off') %}
        
        {% if mode_normal and not est_weekend %}
          {# Mode Normal semaine : protéger plage rallumage → limite #}
          {% if jour_semaine == 0 %}
            {% set rallumage_str = states('input_datetime.planning_normal_lundi_soir_debut') %}
          {% elif jour_semaine == 1 %}
            {% set rallumage_str = states('input_datetime.planning_normal_mardi_soir_debut') %}
          {% elif jour_semaine == 2 %}
            {% set rallumage_str = states('input_datetime.planning_normal_mercredi_soir_debut') %}
          {% elif jour_semaine == 3 %}
            {% set rallumage_str = states('input_datetime.planning_normal_jeudi_soir_debut') %}
          {% elif jour_semaine == 4 %}
            {% set rallumage_str = states('input_datetime.planning_normal_vendredi_soir_debut') %}
          {% else %}
            {% set rallumage_str = '00:00:00' %}
          {% endif %}
          
          {% set rallumage_parts = rallumage_str.split(':') %}
          {% set rallumage_minutes = rallumage_parts[0]|int * 60 + rallumage_parts[1]|int %}
          
          {% set limite_str = states('input_datetime.bureau_arnaud_heure_limite_semaine') %}
          {% set limite_parts = limite_str.split(':') %}
          {% set limite_minutes = limite_parts[0]|int * 60 + limite_parts[1]|int %}
          
          {# Autoriser coupure si HORS de la plage rallumage → limite #}
          {{ heure_actuelle < rallumage_minutes or heure_actuelle >= limite_minutes }}
        {% else %}
          {# Modes actifs ou weekend : pas de protection de plage #}
          true
        {% endif %}
    
    # Condition 9 : EXTINCTION RÉCENTE (< 3 heures)
    - condition: template
      value_template: >
        {% set last_off = as_timestamp(states('input_datetime.bureau_arnaud_last_off')) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set heures_depuis = ((now_ts - last_off) / 3600) | float %}
        {{ heures_depuis < 3 }}
  
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.bureau_arnaud
    
    - delay:
        seconds: 2
  
  mode: single
# ============================================================


