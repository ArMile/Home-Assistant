# 13. Notification changement switch
- id: bureau_julie_notification_switch
  alias: "Bureau Julie - Notification changement switch"
  description: "Envoie un email à chaque changement d'état du switch"
  trigger:
    - platform: state
      entity_id: switch.bureau_julie
