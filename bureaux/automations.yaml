# ============================================================
# COUPURE AUTOMATIQUE
# ============================================================

# 4. Coupure automatique (30 min après extinction si heure limite dépassée)
- id: bureau_maxence_coupure_automatique
  alias: "Bureau Maxence - Coupure automatique"
  description: "Coupe le bureau 30 min après extinction si heure limite dépassée"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    # Condition 1 : Coupure auto activée
    - condition: state
      entity_id: input_boolean.bureau_maxence_auto_coupure
      state: "on"
    
    # Condition 2 : Switch ON
    - condition: state
      entity_id: switch.bureau_maxence
      state: "on"
    
    # Condition 3 : Pas mode vacances
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "off"
    
    # Condition 4 : Bureau éteint (< 30W)
    - condition: numeric_state
      entity_id: sensor.bureau_maxence_power
      below: 30
    
    # Condition 5 : Extinction depuis au moins 30 min
    - condition: template
      value_template: >
        {% set last_off = as_timestamp(states('input_datetime.bureau_maxence_last_off')) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since = ((now_ts - last_off) / 60) | int %}
        {{ minutes_since >= 30 }}
    
    # Condition 6 : Heure limite dépassée (AVEC GESTION MINUIT)
    - condition: template
      value_template: >
        {% set jour_semaine = now().weekday() %}
        {% set est_ferie = is_state('calendar.jours_feries_en_france', 'on') %}
        {% set est_weekend_coupure = (jour_semaine in [4, 5, 6]) or est_ferie %}
        
        {% if est_weekend_coupure %}
          {% set heure_limite_str = states('input_datetime.bureau_maxence_heure_limite_weekend') %}
        {% else %}
          {% set heure_limite_str = states('input_datetime.bureau_maxence_heure_limite_semaine') %}
        {% endif %}
        
        {% set heure_parts = heure_limite_str.split(':') %}
        {% set heure_limite_minutes = heure_parts[0]|int * 60 + heure_parts[1]|int %}
        {% set heure_actuelle = now().hour * 60 + now().minute %}
        
        {# Si on est après minuit (00:00-05:59), considérer qu'on est après la limite de la veille #}
        {% if heure_actuelle < 360 %}
          true
        {% else %}
          {{ heure_actuelle >= heure_limite_minutes }}
        {% endif %}
    
    # Condition 7 : PAS DE RALLUMAGE RÉCENT (au moins 10 min)
    - condition: template
      value_template: >
        {% set switch_last_changed = as_timestamp(states.switch.bureau_maxence.last_changed) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since_change = ((now_ts - switch_last_changed) / 60) | int %}
        {{ minutes_since_change > 10 }}
    
    # Condition 8 : PAS DANS PLAGE ACTIVE (Mode Normal semaine uniquement)
    - condition: template
      value_template: >
        {% set now_hour = now().hour %}
        {% set now_minute = now().minute %}
        {% set heure_actuelle = now_hour * 60 + now_minute %}
        {% set jour_semaine = now().weekday() %}
        {% set est_ferie = is_state('calendar.jours_feries_en_france', 'on') %}
        {% set est_weekend = (jour_semaine in [5, 6]) or est_ferie %}
        
        {% set mode_normal = is_state('input_boolean.chauffage_manuel', 'off') 
                         and is_state('input_boolean.mode_vacances', 'off')
                         and is_state('input_boolean.mode_planning_teletravail', 'off')
                         and is_state('input_boolean.mode_planning_vacances_maison', 'off')
                         and is_state('input_boolean.mode_planning_weekend_prolonge', 'off') %}
        
        {% if mode_normal and not est_weekend %}
          {% if jour_semaine == 0 %}
            {% set rallumage_str = states('input_datetime.planning_normal_lundi_soir_debut') %}
          {% elif jour_semaine == 1 %}
            {% set rallumage_str = states('input_datetime.planning_normal_mardi_soir_debut') %}
          {% elif jour_semaine == 2 %}
            {% set rallumage_str = states('input_datetime.planning_normal_mercredi_soir_debut') %}
          {% elif jour_semaine == 3 %}
            {% set rallumage_str = states('input_datetime.planning_normal_jeudi_soir_debut') %}
          {% elif jour_semaine == 4 %}
            {% set rallumage_str = states('input_datetime.planning_normal_vendredi_soir_debut') %}
          {% else %}
            {% set rallumage_str = '00:00:00' %}
          {% endif %}
          
          {% set rallumage_parts = rallumage_str.split(':') %}
          {% set rallumage_minutes = rallumage_parts[0]|int * 60 + rallumage_parts[1]|int %}
          
          {% set limite_str = states('input_datetime.bureau_maxence_heure_limite_semaine') %}
          {% set limite_parts = limite_str.split(':') %}
          {% set limite_minutes = limite_parts[0]|int * 60 + limite_parts[1]|int %}
          
          {{ heure_actuelle < rallumage_minutes or heure_actuelle >= limite_minutes }}
        {% else %}
          true
        {% endif %}
    
    # Condition 9 : EXTINCTION RÉCENTE (< 3 heures)
    - condition: template
      value_template: >
        {% set last_off = as_timestamp(states('input_datetime.bureau_maxence_last_off')) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set heures_depuis = ((now_ts - last_off) / 3600) | float %}
        {{ heures_depuis < 3 }}
  
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.bureau_maxence
    
    - delay:
        seconds: 2
  
  mode: single

# ============================================================
# BUREAU MAXENCE - EXTINCTION AUTOMATIQUE FORCÉE (HEURE CONFIGURÉE)
# ============================================================
- id: bureau_maxence_extinction_auto_forcee
  alias: "Bureau Maxence - Extinction automatique forcée"
  description: "Coupe le bureau à l'heure configurée, même si PC allumé"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    # Condition 1 : Extinction automatique forcée activée
    - condition: state
      entity_id: input_boolean.bureau_maxence_extinction_auto_forcee
      state: "on"
    
    # Condition 2 : Coupure auto activée
    - condition: state
      entity_id: input_boolean.bureau_maxence_auto_coupure
      state: "on"
    
    # Condition 3 : Switch ON
    - condition: state
      entity_id: switch.bureau_maxence
      state: "on"
    
    # Condition 4 : Pas en mode vacances (absence)
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "off"
    
    # Condition 5 : Heure exacte d'extinction
    - condition: template
      value_template: >
        {% set jour_semaine = now().weekday() %}
        {% set est_ferie = is_state('calendar.jours_feries_en_france', 'on') %}
        {% set mode_vacances_maison = is_state('input_boolean.mode_planning_vacances_maison', 'on') %}
        {% set mode_weekend_prolonge = is_state('input_boolean.mode_planning_weekend_prolonge', 'on') %}
        
        {% set est_weekend_etendu = (jour_semaine in [4, 5]) or est_ferie or mode_vacances_maison or mode_weekend_prolonge %}
        
        {% if est_weekend_etendu %}
          {% set heure_extinction = states('input_datetime.bureau_maxence_extinction_forcee_weekend') %}
        {% else %}
          {% set heure_extinction = states('input_datetime.bureau_maxence_extinction_forcee_ecole') %}
        {% endif %}
        
        {% set now_time = now().strftime('%H:%M:%S') %}
        {{ now_time == heure_extinction }}
  
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.bureau_maxence
    
    - delay:
        seconds: 2
  
  mode: single
# ============================================================

# ============================================================
# BUREAU MAXENCE - EXTINCTION MANUELLE IMMÉDIATE
# ============================================================
- id: bureau_maxence_extinction_manuelle_immediate
  alias: "Bureau Maxence - Extinction manuelle immédiate"
  description: "Coupe le bureau immédiatement quand le toggle est activé"
  trigger:
    - platform: state
      entity_id: input_boolean.bureau_maxence_extinction_manuelle
      to: "on"
  condition:
    # Switch doit être ON
    - condition: state
      entity_id: switch.bureau_maxence
      state: "on"
  action:
    # Coupe le switch
    - service: switch.turn_off
      target:
        entity_id: switch.bureau_maxence
    
    # Attend 2 secondes
    - delay:
        seconds: 2
    
    # Remet le toggle à OFF automatiquement
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.bureau_maxence_extinction_manuelle
  
  mode: single
