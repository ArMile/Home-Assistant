# 5. Rallumage weekend + jours fériés (Mode Normal)
- id: bureau_arnaud_rallumage_weekend_normal
  alias: "Bureau Arnaud - Rallumage weekend (Mode Normal)"
  description: "Rallume le bureau sam-dim + jours fériés en mode Normal"
  trigger:
    - platform: template
      value_template: "{{ states('input_datetime.bureau_arnaud_rallumage_matin') == now().strftime('%H:%M:%S') }}"
  condition:
    - condition: state
      entity_id: input_boolean.chauffage_manuel
      state: "off"
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "off"
    - condition: state
      entity_id: input_boolean.mode_planning_teletravail
      state: "off"
    - condition: state
      entity_id: input_boolean.mode_planning_vacances_maison
      state: "off"
    - condition: state
      entity_id: input_boolean.mode_planning_weekend_prolonge
      state: "off"
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ now().weekday() in [5, 6] }}"
        - condition: state
          entity_id: calendar.jours_feries_en_france
          state: "on"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.bureau_arnaud

