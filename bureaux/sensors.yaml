# ============================================================
# BUREAUX - SENSORS (platform: history_stats)
# Temps de fonctionnement réel des 3 bureaux
# Basés sur binary_sensor.*_reellement_on (seuil > 30W)
# ============================================================

# ------------------------------------------------------------
# BUREAU ARNAUD
# ------------------------------------------------------------
- platform: history_stats
  name: "Bureau Arnaud - Temps ON aujourd'hui"
  entity_id: binary_sensor.bureau_arnaud_reellement_on
  state: "on"
  type: time
  start: "{{ now().replace(hour=0, minute=0, second=0) }}"
  end: "{{ now() }}"

- platform: history_stats
  name: "Bureau Arnaud - Temps ON semaine"
  entity_id: binary_sensor.bureau_arnaud_reellement_on
  state: "on"
  type: time
  start: "{{ as_timestamp(now().replace(hour=0, minute=0, second=0)) - now().weekday() * 86400 }}"
  end: "{{ now() }}"

- platform: history_stats
  name: "Bureau Arnaud - Temps ON mois"
  entity_id: binary_sensor.bureau_arnaud_reellement_on
  state: "on"
  type: time
  start: "{{ now().replace(day=1, hour=0, minute=0, second=0) }}"
  end: "{{ now() }}"

- platform: history_stats
  name: "Bureau Arnaud - Temps ON année"
  entity_id: binary_sensor.bureau_arnaud_reellement_on
  state: "on"
  type: time
  start: "{{ now().replace(month=1, day=1, hour=0, minute=0, second=0) }}"
  end: "{{ now() }}"

