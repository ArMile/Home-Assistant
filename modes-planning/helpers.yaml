# ============================================================
# MODES-PLANNING - HELPERS
# Gestion des modes de planning : Normal, Télétravail,
# Vacances Maison, Weekend Prolongé
# Sync Google Calendar & vacances scolaires
# ============================================================

input_number:

  # Timestamps Télétravail depuis agenda Google
  tt_temp_debut_ts:
    name: "TT Temp Début Timestamp"
    min: 0
    max: 9999999999
    mode: box

  tt_temp_fin_ts:
    name: "TT Temp Fin Timestamp"
    min: 0
    max: 9999999999
    mode: box

input_boolean:

  # Modes de planning actifs
  mode_planning_normal:
    name: Mode Planning Normal
    icon: mdi:calendar-check

  mode_planning_teletravail:
    name: "Planning Télétravail"
    icon: mdi:laptop

  mode_planning_vacances_maison:
    name: "Planning Vacances à la Maison"
    icon: mdi:home-heart

  mode_planning_weekend_prolonge:
    name: "Planning Weekend Prolongé"
    icon: mdi:calendar-weekend

  # Initialisation horaires
  horaires_initialises:
    name: "Horaires Planning Initialisés"
    icon: mdi:check-circle

  # Sync Télétravail et Vacances scolaires
  teletravail_modification_manuelle:
    name: "Planning TT modifié manuellement"
    icon: mdi:pencil

  auto_sync_teletravail:
    name: "Auto-sync Planning Télétravail"
    icon: mdi:sync

  auto_sync_vacances_scolaires:
    name: "Sync auto vacances scolaires"
    icon: mdi:school-sync

