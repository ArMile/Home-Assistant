# --------------------------------------------
# 7.4 BLOQUER MODES DE PLANNING SI VACANCES (Absence)
# --------------------------------------------
- alias: "Planning - Bloquer si Vacances"
  description: "Désactive les modes de planning alternatifs si mode vacances actif"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.mode_planning_teletravail
          - input_boolean.mode_planning_vacances_maison
          - input_boolean.mode_planning_weekend_prolonge
    - service: notify.persistent_notification
      data:
        title: "⚠️ Planning Bloqué"
        message: "Les modes de planning alternatifs sont désactivés pendant les vacances (absence)."
  mode: restart

# --------------------------------------------
# 7.5 DÉSACTIVATION MUTUELLE DES PLANNINGS ALTERNATIFS
# --------------------------------------------
- alias: "Planning - Exclusion Mutuelle"
  description: "Un seul planning alternatif actif à la fois"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
      to: "on"
  action:
    - choose:
        # Si Télétravail activé
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'input_boolean.mode_planning_teletravail' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.mode_planning_vacances_maison
                  - input_boolean.mode_planning_weekend_prolonge

        # Si Vacances Maison activé
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'input_boolean.mode_planning_vacances_maison' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.mode_planning_teletravail
                  - input_boolean.mode_planning_weekend_prolonge

        # Si Weekend Prolongé activé
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'input_boolean.mode_planning_weekend_prolonge' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.mode_planning_teletravail
                  - input_boolean.mode_planning_vacances_maison
  mode: restart

# ============================================================
# 8. PROTECTION & NETTOYAGE
# ============================================================
# --------------------------------------------
# 8.1 VÉRIFICATION QUOTIDIENNE DES DATES EXPIRÉES
# --------------------------------------------
- id: planning_verification_dates_expirees
  alias: "Protection - Vérification dates hors plage"
  description: "Vérifie si des plannings sont hors de leur plage de dates (avant début OU après fin)"
  trigger:
    # Vérification à minuit
    - platform: time
      at: "00:01:00"

    # Vérification au démarrage de HA
    - platform: homeassistant
      event: start

    # Vérification toutes les 5 minutes
    - platform: time_pattern
      minutes: "/5"

    # Vérification immédiate si une date change
    - platform: state
      entity_id:
        - input_datetime.teletravail_debut
        - input_datetime.teletravail_fin
        - input_datetime.vacances_maison_debut
        - input_datetime.vacances_maison_fin
        - input_datetime.weekend_prolonge_debut
        - input_datetime.weekend_prolonge_fin
        - input_datetime.vacances_debut
        - input_datetime.vacances_fin

  action:
    # ========================================
    # MODE VACANCES (ABSENT)
    # ========================================
    - if:
        - condition: state
          entity_id: input_boolean.mode_vacances
          state: "on"
        - condition: template
          value_template: >
            {% set debut = states('input_datetime.vacances_debut') %}
            {% set fin = states('input_datetime.vacances_fin') %}
            {% if debut not in ['unknown', 'unavailable', 'none', '1970-01-01 00:00:00'] and
                  fin not in ['unknown', 'unavailable', 'none', '1970-01-01 23:00:00'] %}
              {{ now() < (debut | as_datetime) or now() > (fin | as_datetime) }}
            {% else %}
              false
            {% endif %}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_vacances
        - service: notify.persistent_notification
          data:
            title: "⏰ Mode Vacances désactivé"
            message: |
              Le mode vacances est hors de sa plage de dates.
              Période configurée : {{ as_timestamp(states('input_datetime.vacances_debut')) | timestamp_custom('%d/%m à %H:%M') }} - {{ as_timestamp(states('input_datetime.vacances_fin')) | timestamp_custom('%d/%m à %H:%M') }}
              Retour au planning normal.

    # ========================================
    # TÉLÉTRAVAIL
    # ========================================
    - if:
        - condition: state
          entity_id: input_boolean.mode_planning_teletravail
          state: "on"
        - condition: template
          value_template: >
            {% set debut = states('input_datetime.teletravail_debut') %}
            {% set fin = states('input_datetime.teletravail_fin') %}
            {% if debut not in ['unknown', 'unavailable', 'none', '1970-01-01 00:00:00'] and
                  fin not in ['unknown', 'unavailable', 'none', '1970-01-01 23:00:00'] %}
              {{ now() < (debut | as_datetime) or now() > (fin | as_datetime) }}
            {% else %}
              false
            {% endif %}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_planning_teletravail
        - service: notify.persistent_notification
          data:
            title: "⏰ Planning Télétravail désactivé"
            message: |
              Le planning télétravail est hors de sa plage de dates.
              Période configurée : {{ as_timestamp(states('input_datetime.teletravail_debut')) | timestamp_custom('%d/%m') }} - {{ as_timestamp(states('input_datetime.teletravail_fin')) | timestamp_custom('%d/%m') }}
              Retour au planning normal.

    # ========================================
    # VACANCES MAISON
    # ========================================
    - if:
        - condition: state
          entity_id: input_boolean.mode_planning_vacances_maison
          state: "on"
        - condition: template
          value_template: >
            {% set debut = states('input_datetime.vacances_maison_debut') %}
            {% set fin = states('input_datetime.vacances_maison_fin') %}
            {% if debut not in ['unknown', 'unavailable', 'none', '1970-01-01 00:00:00'] and
                  fin not in ['unknown', 'unavailable', 'none', '1970-01-01 23:00:00'] %}
              {{ now() < (debut | as_datetime) or now() > (fin | as_datetime) }}
            {% else %}
              false
            {% endif %}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_planning_vacances_maison
        - service: notify.persistent_notification
          data:
            title: "⏰ Planning Vacances Maison désactivé"
            message: |
              Le planning vacances maison est hors de sa plage de dates.
              Période configurée : {{ as_timestamp(states('input_datetime.vacances_maison_debut')) | timestamp_custom('%d/%m') }} - {{ as_timestamp(states('input_datetime.vacances_maison_fin')) | timestamp_custom('%d/%m') }}
              Retour au planning normal.

    # ========================================
    # WEEKEND PROLONGÉ
    # ========================================
    - if:
        - condition: state
          entity_id: input_boolean.mode_planning_weekend_prolonge
          state: "on"
        - condition: template
          value_template: >
            {% set debut = states('input_datetime.weekend_prolonge_debut') %}
            {% set fin = states('input_datetime.weekend_prolonge_fin') %}
            {% if debut not in ['unknown', 'unavailable', 'none', '1970-01-01 00:00:00'] and
                  fin not in ['unknown', 'unavailable', 'none', '1970-01-01 23:00:00'] %}
              {{ now() < (debut | as_datetime) or now() > (fin | as_datetime) }}
            {% else %}
              false
            {% endif %}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.mode_planning_weekend_prolonge
        - service: notify.persistent_notification
          data:
            title: "⏰ Planning Weekend Prolongé désactivé"
            message: |
              Le planning weekend prolongé est hors de sa plage de dates.
              Période configurée : {{ as_timestamp(states('input_datetime.weekend_prolonge_debut')) | timestamp_custom('%d/%m') }} - {{ as_timestamp(states('input_datetime.weekend_prolonge_fin')) | timestamp_custom('%d/%m') }}
              Retour au planning normal.
  mode: single

# --------------------------------------------
# 8.2 PROTECTION ANTI-BOUCLE DE NOTIFICATIONS
# --------------------------------------------
- id: protection_anti_boucle_notifications
  alias: "Protection - Anti-boucle notifications chauffage"
  description: "Empêche les notifications en rafale en cas de dysfonctionnement"
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: input_boolean.chauffage_actif
  action:
    - delay:
        seconds: 30

# --------------------------------------------
# 9.1 NETTOYAGE DES PERIODES PLANNING
# --------------------------------------------
- alias: "Nettoyage Périodes- Modes Planning"
  description: "Désactive les périodes qui ne correspondent plus au mode actif"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
  action:
    # Si on n'est PAS en télétravail, désactiver sa période
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.periode_teletravail

    # Si on n'est PAS en vacances maison, désactiver sa période
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_vacances_maison
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.periode_vacances_maison

    # Si on n'est PAS en weekend prolongé, désactiver sa période
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_weekend_prolonge
              state: "off"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.periode_weekend_prolonge
  mode: restart

# ============================================
# 9.2 SYNCHRONISATION MODE PLANNING NORMAL
# ============================================
- alias: "Sync État Mode Normal"
  description: "Synchronise l'état du mode normal avec les autres modes"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.mode_planning_teletravail
        - input_boolean.mode_planning_vacances_maison
        - input_boolean.mode_planning_weekend_prolonge
    - platform: homeassistant
      event: start
  action:
    - choose:
        # Si tous les modes spéciaux sont OFF → Mode Normal ON
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
