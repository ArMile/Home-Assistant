# ============================================================
# TABLE DES MATIÈRES - AUTOMATIONS MODES-PLANNING
# Mise à jour : Mars 2026
# ============================================================
#
# ┌─────────────────────────────────────────────────────────────┐
# │ 1.  INITIALISATION                                   (1)    │
# │     1.1  Phase 1 - Initialisation Automatique Horaires      │
# ├─────────────────────────────────────────────────────────────┤
# │ 7.  MODES DE PLANNING AVEC DATES                     (5)    │
# │     7.1  Planning - Télétravail Auto (priorité 4)           │
# │     7.2  Planning - Vacances Maison Auto (priorité 5)       │
# │     7.3  Planning - Weekend Prolongé Auto (priorité 6)      │
# │     7.4  Planning - Bloquer si Vacances                     │
# │     7.5  Planning - Exclusion Mutuelle                      │
# ├─────────────────────────────────────────────────────────────┤
# │ 8.  PROTECTION & NETTOYAGE                           (4)    │
# │     8.1  Protection - Vérification dates hors plage         │
# │     8.2  Protection - Anti-boucle notifications             │
# │     9.1  Nettoyage Périodes - Modes Planning                │
# │     9.2  Sync État Mode Normal                              │
# ├─────────────────────────────────────────────────────────────┤
# │ 9.  SYNC VACANCES SCOLAIRES                          (3)    │
# │     9.3  Planning - Auto sync vacances maison               │
# │     9.4  Planning - Clear vacances maison (binary off)      │
# │     9.5  Planning - Clear vacances maison (23:00)           │
# ├─────────────────────────────────────────────────────────────┤
# │ 10. HORAIRES DYNAMIQUES PHASE 2                      (7)    │
# │     10.1 Phase 2 - Planning Normal Matin                    │
# │     10.2 Phase 2 - Planning Normal Soir Lun-Mar-Jeu-Ven     │
# │     10.3 Phase 2 - Planning Normal Mercredi Soir            │
# │     10.4 Phase 2 - Planning Normal Weekend                  │
# │     10.5 Phase 2 - Planning Télétravail (7j)                │
# │     10.6 Phase 2 - Planning Vacances Maison                 │
# │     10.7 Phase 2 - Planning Weekend Prolongé                │
# ├─────────────────────────────────────────────────────────────┤
# │ 17. PLANNING TÉLÉTRAVAIL - SYNC CALENDRIER           (3)    │
# │     17.1 Planning TT - Vérification périodique             │
# │     17.2 Planning TT - Reset lundi matin                   │
# │     17.3 Planning TT - Détection modification manuelle     │
# └─────────────────────────────────────────────────────────────┘
#
# ============================================================

# ============================================================
# 1. INITIALISATION
# ============================================================
# --------------------------------------------
# 1.1 INITIALISATION des Horaires Confort des Plannings
# --------------------------------------------
- alias: "Phase 1 - Initialisation Automatique Horaires"
  description: "Initialise les horaires au premier démarrage uniquement"
  trigger:
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.horaires_initialises
      state: "off"
  action:
    - delay:
        seconds: 10
    - service: script.initialiser_tous_horaires_planning
  mode: single

# ============================================================
# 7. MODES DE PLANNING AVEC DATES
# ============================================================
# ============================================
# 7. GESTION MODES DE PLANNING AVEC DATES
# ============================================
# --------------------------------------------
# 7.1 MODE TÉLÉTRAVAIL - PRIORITÉ 4
# --------------------------------------------
- alias: "Planning - Télétravail Auto"
  description: "Active/désactive le planning télétravail selon les dates"
  trigger:
    - platform: time_pattern
      minutes: '/1'
    - platform: state
      entity_id:
        - input_datetime.teletravail_debut
        - input_datetime.teletravail_fin
        - input_boolean.mode_planning_teletravail
  action:
    - choose:
        # ACTIVATION
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
              state: 'off'
            - condition: template
              value_template: >
                {% set debut = states('input_datetime.teletravail_debut') %}
                {% set fin = states('input_datetime.teletravail_fin') %}
                {% if debut not in ['unknown', 'unavailable', 'none'] and fin not in ['unknown', 'unavailable', 'none'] %}
                  {{ as_timestamp(now()) >= as_timestamp(debut) and as_timestamp(now()) <= as_timestamp(fin) }}
                {% else %} false {% endif %}
            - condition: state
              entity_id: input_boolean.mode_vacances
              state: 'off'
            - condition: state
              entity_id: input_boolean.chauffage_manuel
              state: 'off'
            - condition: state
              entity_id: input_boolean.boost_temperature
              state: 'off'
          sequence:
            - service: input_boolean.turn_on
              target: {entity_id: input_boolean.mode_planning_teletravail}
            - service: notify.persistent_notification
              data:
                title: 💼 Planning Télétravail Activé
                message: |
                  Planning Télétravail activé automatiquement.

                  📅 Horaires de confort :
                  • Lundi : {{ states('input_datetime.planning_teletravail_lundi_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_lundi_fin')[:-3] }}
                  • Mardi : {{ states('input_datetime.planning_teletravail_mardi_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_mardi_fin')[:-3] }}
                  • Mercredi : {{ states('input_datetime.planning_teletravail_mercredi_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_mercredi_fin')[:-3] }}
                  • Jeudi : {{ states('input_datetime.planning_teletravail_jeudi_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_jeudi_fin')[:-3] }}
                  • Vendredi : {{ states('input_datetime.planning_teletravail_vendredi_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_vendredi_fin')[:-3] }}
                  • Samedi : {{ states('input_datetime.planning_teletravail_samedi_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_samedi_fin')[:-3] }}
                  • Dimanche : {{ states('input_datetime.planning_teletravail_dimanche_debut')[:-3] }} → {{ states('input_datetime.planning_teletravail_dimanche_fin')[:-3] }}

                  🗓️ Du {{ as_timestamp(states('input_datetime.teletravail_debut')) | timestamp_custom('%d/%m/%Y à %H:%M') }} au {{ as_timestamp(states('input_datetime.teletravail_fin')) | timestamp_custom('%d/%m/%Y à %H:%M') }}

        # DÉSACTIVATION
        - conditions:
            - condition: state
              entity_id: input_boolean.mode_planning_teletravail
              state: 'on'
            - condition: template
              value_template: >
                {% set debut = states('input_datetime.teletravail_debut') %}
                {% set fin = states('input_datetime.teletravail_fin') %}
                {% if debut not in ['unknown', 'unavailable', 'none'] and fin not in ['unknown', 'unavailable', 'none'] %}
                  {{ as_timestamp(now()) < as_timestamp(debut) or as_timestamp(now()) > as_timestamp(fin) }}
                {% else %} false {% endif %}
          sequence:
            - service: input_boolean.turn_off
              target: {entity_id: input_boolean.mode_planning_teletravail}
            - service: notify.persistent_notification
              data:
                title: 🏢 Fin Télétravail
                message: Retour au planning normal
  mode: single

