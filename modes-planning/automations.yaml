# ============================================================
# 9. SYNC VACANCES SCOLAIRES
# ============================================================
# ============================================
# 9.3 SYNCHRONISATION AUTO MODE VACANCES MAISON DEPUIS CALENDRIER VACANCES SCOLAIRES
# ============================================
- alias: "Planning - Auto sync vacances maison"
  description: "Synchronise automatiquement le planning Vacances Maison avec les vacances scolaires"
  trigger:
    # Quand le sensor des vacances EN COURS change
    - platform: state
      entity_id: sensor.vacances_fr_current_zone_b

    # Quand le sensor des PROCHAINES vacances change
    - platform: state
      entity_id: sensor.vacances_fr_next_zone_b

    # Quand le binary_sensor "demain" change (passage d'avant à pendant)
    - platform: state
      entity_id: binary_sensor.vacances_fr_tomorrow_zone_b
      to: 'on'

    # Quand on sort des vacances (demain passe à off)
    - platform: state
      entity_id: binary_sensor.vacances_fr_tomorrow_zone_b
      to: 'off'

    # Vérification quotidienne à 6h
    - platform: time
      at: "06:00:00"

    # Vérification à minuit
    - platform: time
      at: "00:01:00"

    # Au démarrage de Home Assistant
    - platform: homeassistant
      event: start

  condition:
    # Vérifier que la sync auto est activée
    - condition: state
      entity_id: input_boolean.auto_sync_vacances_scolaires
      state: 'on'

    # Vérifier qu'on a des données valides
    - condition: or
      conditions:
        - condition: template
          value_template: >
            {{ states('sensor.vacances_fr_current_zone_b') not in ['unknown', 'unavailable', 'Aucune'] }}
        - condition: template
          value_template: >
            {{ states('sensor.vacances_fr_next_zone_b') not in ['unknown', 'unavailable'] }}

  action:
    - service: script.sync_vacances_maison_depuis_calendrier

# 9.4 CLEAR vacances maison après période (binary off)
- alias: "Planning - Clear vacances maison après période"
  description: "Efface les dates après vacances et sync avec prochaines"
  trigger:
    # Le lendemain de la fin des vacances (demain = off après avoir été on)
    - platform: state
      entity_id: binary_sensor.vacances_fr_tomorrow_zone_b
      to: 'off'
      for: "06:00:00"  # 6h après le passage à off = on est sûr d'être sorti

  condition:
    - condition: state
      entity_id: input_boolean.auto_sync_vacances_scolaires
      state: 'on'

    # Vérifier qu'on a bien des prochaines vacances disponibles
    - condition: template
      value_template: >
        {{ states('sensor.vacances_fr_next_zone_b') not in ['unknown', 'unavailable'] }}

  action:
    # Synchroniser avec les PROCHAINES vacances
    - service: script.sync_vacances_maison_depuis_calendrier

    # Notification
    - service: notify.persistent_notification
      data:
        title: "🏖️ Vacances Maison"
        message: "Vacances terminées. Planning mis à jour avec {{ states('sensor.vacances_fr_next_zone_b') }}."

# 9.5 CLEAR vacances maison après période (23:00)
- alias: "Planning - Clear vacances maison à 23h"
  description: "Efface les dates de vacances maison après la fin de la période"
  trigger:
    - platform: time
      at: "23:00:00"

  condition:
    - condition: state
      entity_id: input_boolean.auto_sync_vacances_scolaires
      state: 'on'

    - condition: template
      value_template: >
        {% set fin = states('input_datetime.vacances_maison_fin') %}
        {% if fin not in ['unknown', 'unavailable', ''] %}
          {{ as_timestamp(fin) < (as_timestamp(now()) - 86400) }}
        {% else %}
          false
        {% endif %}

  action:
    - service: input_datetime.set_datetime
      target:
        entity_id:
          - input_datetime.vacances_maison_debut
          - input_datetime.vacances_maison_fin
      data:
        date: "1970-01-01"

    - service: notify.persistent_notification
      data:
        title: "🏖️ Vacances Maison"
        message: "Planning effacé automatiquement (vacances terminées)"

