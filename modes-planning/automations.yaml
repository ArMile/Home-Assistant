                {% set now_time = now().strftime('%H:%M:%S') %}
                {% set debut = states('input_datetime.planning_weekend_prolonge_debut') %}
                {% set fin = states('input_datetime.planning_weekend_prolonge_fin') %}
                {{ debut <= now_time < fin }}
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.periode_normal_matin
                  - input_boolean.periode_normal_soir
                  - input_boolean.periode_normal_weekend
                  - input_boolean.periode_teletravail
                  - input_boolean.periode_vacances_maison
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.periode_weekend_prolonge
      # DÉSACTIVATION
      default:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.periode_weekend_prolonge
  mode: single
