views:
  - title: État Planning
    path: etat-planning
    icon: mdi:information-variant-box-outline
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr
          grid-gap: 12px
          margin: 0
          padding: 12px
        cards:
          - type: custom:mushroom-chips-card
            alignment: left
            view_layout:
              grid-column: 1 / -1
            chips:
              - type: template
                icon: mdi:home
                content: Accueil
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-accueil/home
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🎯 Mode Actif
                subtitle: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}
                    🛫 Vacances (Absence) • {{ states('input_number.temp_vacances') }}°C
                  {% elif is_state('input_boolean.chauffage_manuel', 'on') %}
                    ✋ Manuel • {{ states('input_number.temp_consigne_manuelle') }}°C
                  {% elif is_state('input_boolean.boost_temperature', 'on') %}
                    🔥 Boost • {{ states('input_number.temp_consigne_active') }}°C
                  {% elif is_state('input_boolean.mode_planning_teletravail',
                  'on') %}
                    💼 Télétravail • {{ states('input_number.temp_consigne_active') }}°C
                  {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}
                    🏖️ Vacances Maison • {{ states('input_number.temp_consigne_active') }}°C
                  {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}
                    🎉 Weekend Prolongé • {{ states('input_number.temp_consigne_active') }}°C
                  {% else %}
                    📅 Planning Normal • {{ states('input_number.temp_consigne_active') }}°C
                  {% endif %}
              - type: custom:mushroom-template-card
                entity: input_number.temp_consigne_active
                primary: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}🛫 MODE
                  VACANCES (Absence) {% elif
                  is_state('input_boolean.chauffage_manuel', 'on') %}✋ MODE
                  MANUEL {% elif is_state('input_boolean.boost_temperature',
                  'on') %}🔥 MODE BOOST {% elif
                  is_state('input_boolean.mode_planning_teletravail', 'on') %}💼
                  PLANNING TÉLÉTRAVAIL {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}🏖️ VACANCES MAISON {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}🎉 WEEKEND PROLONGÉ {% else %}📅 PLANNING NORMAL{% endif %}
                secondary: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}
                    Hors-gel {{ states('input_number.temp_vacances') }}°C • Fin {{ as_timestamp(states('input_datetime.vacances_fin')) | timestamp_custom('%d/%m à %H:%M') }}
                  {% elif is_state('input_boolean.chauffage_manuel', 'on') %}
                    Consigne {{ states('input_number.temp_consigne_manuelle') }}°C • Jusqu'à désactivation
                  {% elif is_state('input_boolean.boost_temperature', 'on') %}
                    +{{ states('input_number.boost_temperature_supplementaire') }}°C → {{ states('input_number.temp_consigne_active') }}°C • Fin {{ as_timestamp(states('input_datetime.boost_fin')) | timestamp_custom('%H:%M') }}
                  {% elif is_state('input_boolean.mode_planning_teletravail',
                  'on') %}
                    Fin {{ as_timestamp(states('input_datetime.teletravail_fin')) | timestamp_custom('%d/%m/%Y') }}
                  {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}
                    Fin {{ as_timestamp(states('input_datetime.vacances_maison_fin')) | timestamp_custom('%d/%m/%Y') }}
                  {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}
                    Fin {{ as_timestamp(states('input_datetime.weekend_prolonge_fin')) | timestamp_custom('%d/%m/%Y') }}
                  {% else %}
                    {% if is_state('schedule.chauffage_semaine_matin', 'on') %}🌅 Période Confort Matin
                    {% elif is_state('schedule.chauffage_semaine_soir', 'on') %}🌆 Période Confort Soir
                    {% elif is_state('schedule.chauffage_weekend', 'on') %}🎈 Période Confort Weekend
                    {% else %}💚 Mode Éco{% endif %}
                  {% endif %}
                icon: >
                  {% if is_state('input_boolean.mode_vacances', 'on')
                  %}mdi:airplane-takeoff {% elif
                  is_state('input_boolean.chauffage_manuel', 'on')
                  %}mdi:hand-back-right {% elif
                  is_state('input_boolean.boost_temperature', 'on')
                  %}mdi:fire-alert {% elif
                  is_state('input_boolean.mode_planning_teletravail', 'on')
                  %}mdi:laptop {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}mdi:home-heart {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}mdi:party-popper {% else %}mdi:calendar-check{% endif %}
                icon_color: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}blue {%
                  elif is_state('input_boolean.chauffage_manuel', 'on') %}orange
                  {% elif is_state('input_boolean.boost_temperature', 'on')
                  %}red {% elif
                  is_state('input_boolean.mode_planning_teletravail', 'on')
                  %}teal {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}pink {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}purple {% else %}green{% endif %}
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_boolean.mode_vacances', 'on') %}
                        background: rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3;
                      {% elif is_state('input_boolean.chauffage_manuel', 'on') %}
                        background: rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800;
                      {% elif is_state('input_boolean.boost_temperature', 'on') %}
                        background: rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336;
                      {% elif is_state('input_boolean.mode_planning_teletravail', 'on') %}
                        background: rgba(0, 150, 136, 0.1); border-left: 4px solid #009688;
                      {% elif is_state('input_boolean.mode_planning_vacances_maison', 'on') %}
                        background: rgba(233, 30, 99, 0.1); border-left: 4px solid #E91E63;
                      {% elif is_state('input_boolean.mode_planning_weekend_prolonge', 'on') %}
                        background: rgba(156, 39, 176, 0.1); border-left: 4px solid #9C27B0;
                      {% else %}
                        background: rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50;
                      {% endif %}
                      transition: all 0.3s ease;
                    }
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: input_boolean.mode_planning_normal
                    name: Normal
                    icon: mdi:calendar-check
                    color: green
                    tap_action:
                      action: call-service
                      service: script.planning_mode_normal
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; } ha-card:hover {
                        transform: translateY(-2px); box-shadow: 0 4px 8px
                        rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_planning_teletravail
                    name: Télétravail
                    icon: mdi:laptop
                    color: teal
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; } ha-card:hover {
                        transform: translateY(-2px); box-shadow: 0 4px 8px
                        rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_planning_vacances_maison
                    name: Vac. Maison
                    icon: mdi:home-heart
                    color: pink
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; } ha-card:hover {
                        transform: translateY(-2px); box-shadow: 0 4px 8px
                        rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_planning_weekend_prolonge
                    name: Weekend+
                    icon: mdi:calendar-weekend
                    color: purple
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; } ha-card:hover {
                        transform: translateY(-2px); box-shadow: 0 4px 8px
                        rgba(0,0,0,0.2); }
                  - type: tile
                    entity: input_boolean.mode_vacances
                    name: Vacances
                    icon: mdi:airplane-takeoff
                    color: blue
                    tap_action:
                      action: toggle
                    card_mod:
                      style: >
                        ha-card { transition: all 0.3s ease; } ha-card:hover {
                        transform: translateY(-2px); box-shadow: 0 4px 8px
                        rgba(0,0,0,0.2); }
                  - type: tile
                    entity: script.reinitialiser_tous_plannings
                    name: Réinitialiser
                    icon: mdi:restart-alert
                    color: red
                    tap_action:
                      action: call-service
                      service: script.reinitialiser_tous_plannings
                      data: {}
                      confirmation:
                        text: >-
                          Voulez-vous vraiment réinitialiser tous les plannings
                          ?
                    card_mod:
                      style: |
                        ha-card {
                          --tile-color: #f44336 !important;
                          background: rgba(244, 67, 54, 0.2) !important;
                        }
              - type: markdown
                content: >
                  ---

                  Priorisation des Planning 📈

                  1. 🛫Vacances → 2. ✋Manuel → 3. 🔥Boost → 4. 💼Télétravail →
                  5. 🏖️Vac. Maison → 6. 🎉Weekend+ → 7. 📅Planning Normal → 8.
                  💚Éco
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.03);
                      border: 1px solid rgba(255, 255, 255, 0.1);
                      border-radius: 12px;
                    }
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 📋 Détails du Planning
              - type: markdown
                content: >
                  {% if is_state('input_boolean.mode_vacances', 'on') %}

                  #### 🌡️ Températures - **Température unique** : {{
                  states('input_number.temp_vacances') }}°C - **Mode** :
                  Hors-gel / Absence prolongée

                  #### 📅 Période - **Début** : {{
                  as_timestamp(states('input_datetime.vacances_debut')) |
                  timestamp_custom('%d/%m/%Y à %H:%M') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.vacances_fin')) |
                  timestamp_custom('%d/%m/%Y à %H:%M') }}

                  --- ⚠️ **Priorité absolue** : Tous les autres modes sont
                  désactivés

                  {% elif is_state('input_boolean.chauffage_manuel', 'on') %}

                  #### 🌡️ Température - **Consigne manuelle** : {{
                  states('input_number.temp_consigne_manuelle') }}°C -
                  **Contrôle** : Total utilisateur

                  #### ⏱️ Durée - **Actif** : Jusqu'à désactivation manuelle -
                  **Retour auto** : Aux changements de plage horaire du planning
                  normal

                  {% elif is_state('input_boolean.boost_temperature', 'on') %}

                  #### 🌡️ Températures - **Base** : {{
                  states('input_number.temp_confort') if
                  is_state('schedule.chauffage_semaine_matin', 'on') or
                  is_state('schedule.chauffage_semaine_soir', 'on') or
                  is_state('schedule.chauffage_weekend', 'on') else
                  states('input_number.temp_eco') }}°C - **Boost** : +{{
                  states('input_number.boost_temperature_supplementaire') }}°C -
                  **Total** : {{ states('input_number.temp_consigne_active')
                  }}°C

                  #### ⏱️ Durée - **Début** : {{
                  (as_timestamp(states('input_datetime.boost_fin')) -
                  (states('input_number.boost_duree')|float * 3600)) |
                  timestamp_custom('%H:%M') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.boost_fin')) |
                  timestamp_custom('%H:%M') }} - **Restant** : {{
                  ((as_timestamp(states('input_datetime.boost_fin')) -
                  now().timestamp()) / 60) | round(0) }} min

                  {% elif is_state('input_boolean.mode_planning_teletravail',
                  'on') %}

                  #### 🌡️ Températures - **Confort** : {{
                  states('input_number.temp_confort') }}°C - **Éco** : {{
                  states('input_number.temp_eco') }}°C - **Actuelle** : {{
                  states('input_number.temp_consigne_active') }}°C

                  #### 📅 Horaires Semaine * **📅 Lundi** : {{
                  states('input_datetime.planning_teletravail_lundi_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_lundi_fin')[:-3]
                  }} (Confort) * **📅 Mardi** : {{
                  states('input_datetime.planning_teletravail_mardi_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_mardi_fin')[:-3]
                  }} (Confort) * **📅 Mercredi** : {{
                  states('input_datetime.planning_teletravail_mercredi_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_mercredi_fin')[:-3]
                  }} (Confort) * **📅 Jeudi** : {{
                  states('input_datetime.planning_teletravail_jeudi_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_jeudi_fin')[:-3]
                  }} (Confort) * **📅 Vendredi** : {{
                  states('input_datetime.planning_teletravail_vendredi_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_vendredi_fin')[:-3]
                  }} (Confort)

                  #### 📅 Horaires Weekend * **📅 Samedi** : {{
                  states('input_datetime.planning_teletravail_samedi_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_samedi_fin')[:-3]
                  }} (Confort) * **📅 Dimanche** : {{
                  states('input_datetime.planning_teletravail_dimanche_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_teletravail_dimanche_fin')[:-3]
                  }} (Confort) * **🌙 Hors périodes confort** : Éco

                  #### 📆 Période - **Début** : {{
                  as_timestamp(states('input_datetime.teletravail_debut')) |
                  timestamp_custom('%d/%m/%Y') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.teletravail_fin')) |
                  timestamp_custom('%d/%m/%Y') }}

                  {% elif
                  is_state('input_boolean.mode_planning_vacances_maison', 'on')
                  %}

                  #### 🌡️ Températures - **Confort** : {{
                  states('input_number.temp_confort') }}°C - **Éco** : {{
                  states('input_number.temp_eco') }}°C - **Actuelle** : {{
                  states('input_number.temp_consigne_active') }}°C

                  #### 📅 Horaires (7j/7) - **Tous les jours** : {{
                  states('input_datetime.planning_vacances_maison_debut') }} →
                  {{ states('input_datetime.planning_vacances_maison_fin') }}
                  (Confort) - **Nuit** : Éco

                  #### 📆 Période - **Début** : {{
                  as_timestamp(states('input_datetime.vacances_maison_debut')) |
                  timestamp_custom('%d/%m/%Y') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.vacances_maison_fin')) |
                  timestamp_custom('%d/%m/%Y') }}

                  {% elif
                  is_state('input_boolean.mode_planning_weekend_prolonge', 'on')
                  %}

                  #### 🌡️ Températures - **Confort** : {{
                  states('input_number.temp_confort') }}°C - **Éco** : {{
                  states('input_number.temp_eco') }}°C - **Actuelle** : {{
                  states('input_number.temp_consigne_active') }}°C

                  #### 📅 Horaires (7j/7) - **Tous les jours** : {{
                  states('input_datetime.planning_weekend_prolonge_debut') }} →
                  {{ states('input_datetime.planning_weekend_prolonge_fin') }}
                  (Confort) - **Nuit** : Éco

                  #### 📆 Période - **Début** : {{
                  as_timestamp(states('input_datetime.weekend_prolonge_debut'))
                  | timestamp_custom('%d/%m/%Y') }} - **Fin** : {{
                  as_timestamp(states('input_datetime.weekend_prolonge_fin')) |
                  timestamp_custom('%d/%m/%Y') }}

                  {% else %}

                  #### 🌡️ Températures - **Confort** : {{
                  states('input_number.temp_confort') }}°C - **Éco** : {{
                  states('input_number.temp_eco') }}°C - **Actuelle** : {{
                  states('input_number.temp_consigne_active') }}°C

                  #### 📅 Horaires Semaine (Lun-Ven) * **🌅 Matin** : {{
                  states('input_datetime.planning_normal_lun_ven_matin_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_lun_ven_matin_fin')[:-3]
                  }} (Confort) * **📅 Lundi soir** : {{
                  states('input_datetime.planning_normal_lundi_soir_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_lundi_soir_fin')[:-3]
                  }} (Confort) * **📅 Mardi soir** : {{
                  states('input_datetime.planning_normal_mardi_soir_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_mardi_soir_fin')[:-3]
                  }} (Confort) * **📅 Mercredi soir** : {{
                  states('input_datetime.planning_normal_mercredi_soir_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_mercredi_soir_fin')[:-3]
                  }} (Confort) * **📅 Jeudi soir** : {{
                  states('input_datetime.planning_normal_jeudi_soir_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_jeudi_soir_fin')[:-3]
                  }} (Confort) * **📅 Vendredi soir** : {{
                  states('input_datetime.planning_normal_vendredi_soir_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_vendredi_soir_fin')[:-3]
                  }} (Confort)

                  #### 📅 Horaires Weekend * **📅 Samedi** : {{
                  states('input_datetime.planning_normal_samedi_debut')[:-3] }}
                  → {{ states('input_datetime.planning_normal_samedi_fin')[:-3]
                  }} (Confort) * **📅 Dimanche** : {{
                  states('input_datetime.planning_normal_dimanche_debut')[:-3]
                  }} → {{
                  states('input_datetime.planning_normal_dimanche_fin')[:-3] }}
                  (Confort) * **🌙 Hors périodes confort** : Éco

                  {% endif %}
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.03);
                      border: 1px solid rgba(255, 255, 255, 0.1);
                      border-radius: 12px;
                    }
  - title: Paramétrage Planning
    path: parametrage-planning
    icon: mdi:calendar-multiselect-outline
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr 1fr
          grid-gap: 12px
          margin: 0
          padding: 12px
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 💼 Planning Télétravail
                subtitle: >
                  {% if is_state('input_boolean.mode_planning_teletravail',
                  'on') %}✅ Actif{% else %}⬚ Inactif{% endif %}
              - type: custom:mushroom-entity-card
                entity: input_boolean.mode_planning_teletravail
                name: Activer le mode
                icon: mdi:laptop
                icon_color: >
                  {% if is_state('input_boolean.mode_planning_teletravail',
                  'on') %}teal{% else %}grey{% endif %}
                badge_icon: >
                  {% if is_state('input_boolean.mode_planning_teletravail',
                  'on') %}mdi:check-bold{% else %}mdi:close-thick{% endif %}
                badge_color: >
                  {% if is_state('input_boolean.mode_planning_teletravail',
                  'on') %}teal{% else %}grey{% endif %}
                tap_action:
                  action: toggle
                  haptic: medium
                card_mod:
                  style: >
                    ha-card {
                      {% if is_state('input_boolean.mode_planning_teletravail', 'on') %}
                        background: rgba(0, 150, 136, 0.1); border-left: 4px solid #009688;
                      {% else %}
                        background: rgba(255, 255, 255, 0.03); border-left: 4px solid #757575;
                      {% endif %}
                      transition: all 0.3s ease;
                    } ha-card:hover { transform: translateY(-2px); box-shadow: 0
                    4px 8px rgba(0,0,0,0.2); }
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: input_datetime.teletravail_debut
                    primary: >-
                      {{
                      as_timestamp(states('input_datetime.teletravail_debut')) |
                      timestamp_custom('%d/%m/%Y à %H:%M') }}
                    secondary: Date de début
                    icon: mdi:calendar-arrow-right
                    icon_color: teal
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: input_datetime.teletravail_fin
                    primary: >-
                      {{ as_timestamp(states('input_datetime.teletravail_fin'))
                      | timestamp_custom('%d/%m/%Y à %H:%M') }}
                    secondary: Date de fin
                    icon: mdi:calendar-arrow-left
                    icon_color: teal
                    tap_action:
                      action: more-info
              - type: custom:mushroom-entity-card
                entity: input_boolean.auto_sync_teletravail
                name: 🔄 Auto-sync (toutes les 15min)
                icon: mdi:sync
                icon_color: >
                  {% if is_state('input_boolean.auto_sync_teletravail', 'on')
                  %}green{% else %}grey{% endif %}
                tap_action:
                  action: toggle
                  haptic: medium
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_boolean.auto_sync_teletravail', 'on') %}
                        background: rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50;
                      {% else %}
                        background: rgba(255, 255, 255, 0.03); border-left: 4px solid #757575;
                      {% endif %}
                    }
              - type: custom:mushroom-template-card
                entity: sensor.prochain_bloc_teletravail
                primary: '{{ states(''sensor.prochain_bloc_teletravail'') }}'
                secondary: 📅 Prochain bloc détecté
                icon: mdi:calendar-search
                icon_color: teal
              - type: conditional
                conditions:
                  - entity: input_boolean.teletravail_modification_manuelle
                    state: 'on'
                card:
                  type: custom:mushroom-template-card
                  primary: ⚠️ Modifié manuellement
                  secondary: Sync désactivée jusqu'à lundi
                  icon: mdi:alert
                  icon_color: amber
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 193, 7, 0.15); border-left: 4px solid #FFC107;
                      }
              - type: custom:mushroom-template-card
                entity: script.sync_planning_teletravail
                primary: Forcer la synchronisation
                secondary: ''
                icon: mdi:sync
                icon_color: teal
                tap_action:
                  action: call-service
                  service: script.sync_planning_teletravail
                card_mod:
                  style: >
                    ha-card {
                      background: rgba(0, 150, 136, 0.08); border-left: 4px solid #009688;
                      cursor: pointer; transition: all 0.3s ease;
                    } ha-card:hover { background: rgba(0, 150, 136, 0.15);
                    transform: translateY(-2px); box-shadow: 0 4px 8px
                    rgba(0,0,0,0.2); }
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: 🏖️ Planning Vacances Maison
                subtitle: >
                  {% if is_state('input_boolean.mode_planning_vacances_maison',
                  'on') %}✅ Actif{% else %}⬚ Inactif{% endif %}
              - type: custom:mushroom-entity-card
