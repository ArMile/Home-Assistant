    # Automation activée
    - condition: state
      entity_id: input_boolean.frigo_surplus_actif
      state: 'on'
    
    # Soleil levé
    - condition: sun
      after: sunrise
      before: sunset
  
  action:
    # Baisser température frigo
    - service: number.set_value
      target:
