# BALLON EAU CHAUDE - AUTOMATIONS COMPLÈTES
# ============================================================

# ============================================================
# 11.1 MISE À JOUR AUTOMATIQUE DES HEURES (LEVER/COUCHER SOLEIL)
# ============================================================
- id: ballon_maj_heures_soleil
  alias: "Ballon - MAJ heures selon soleil"
  description: "Met à jour les heures de début/fin selon le lever/coucher du soleil"
  
  trigger:
    # Tous les jours à minuit
    - platform: time
      at: "00:01:00"
    
    # Au démarrage de HA
    - platform: homeassistant
      event: start
  
  action:
    # Calculer heure de lever + marge personnalisable
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ballon_heure_debut
      data:
        time: >
          {% set sunrise = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
          {% set marge = states('input_number.ballon_marge_debut') | int %}
          {% set debut = sunrise + timedelta(minutes=marge) %}
          {{ debut.strftime('%H:%M') }}
    
    # Calculer heure de coucher - marge personnalisable
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ballon_heure_fin
      data:
        time: >
          {% set sunset = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
          {% set marge = states('input_number.ballon_marge_fin') | int %}
          {% set fin = sunset - timedelta(minutes=marge) %}
          {{ fin.strftime('%H:%M') }}
    
    # Notification de confirmation
    - service: persistent_notification.create
      data:
        title: "☀️ Ballon - Heures mises à jour"
        message: >
          Nouvelles heures de fonctionnement :
          
          Début : {{ states('input_datetime.ballon_heure_debut') }}
          Fin : {{ states('input_datetime.ballon_heure_fin') }}
          
          Lever du soleil : {{ states('sensor.heure_lever_du_soleil') }}
          Coucher du soleil : {{ states('sensor.heure_coucher_du_soleil') }}
  
  mode: single

# ============================================================
# 11.2 DÉMARRAGE SUR SURPLUS
# ============================================================
- id: ballon_demarrage_surplus
  alias: "Ballon - Démarrage sur surplus"
  description: "Active le ballon quand surplus solaire suffisant"
  
  trigger:
    - platform: numeric_state
      entity_id: sensor.puissance_surplus_solaire
      above: input_number.ballon_seuil_demarrage
      for:
        minutes: 2
  
  condition:
    # Le ballon n'est pas déjà en marche
    - condition: state
      entity_id: switch.ballon_eau_chaude
      state: 'off'
    
    # L'automation est activée
    - condition: state
      entity_id: input_boolean.ballon_surplus_actif
      state: 'on'
    
    # Soleil levé
    - condition: sun
      after: sunrise
      before: sunset
    
    # Plage horaire (heures ajustées automatiquement)
    - condition: template
      value_template: >
        {% set now_time = now().strftime('%H:%M') %}
        {% set debut = states('input_datetime.ballon_heure_debut') %}
        {% set fin = states('input_datetime.ballon_heure_fin') %}
        {{ debut <= now_time < fin }}
  
  action:
    # Activer le contacteur
    - service: switch.turn_on
      target:
        entity_id: switch.ballon_eau_chaude
    
    # Mettre à jour le statut
    - service: input_select.select_option
      target:
        entity_id: input_select.ballon_statut
      data:
        option: "En chauffe (surplus)"
    
    # Notification dans HA
    - service: persistent_notification.create
      data:
        title: "🌞 Ballon Eau Chaude"
        message: >
          Démarrage sur surplus solaire
          
          Surplus actuel: {{ states('sensor.puissance_surplus_solaire') }}W
          Seuil: {{ states('input_number.ballon_seuil_demarrage') }}W
          Heure: {{ now().strftime('%H:%M') }}
    
    # Notification Email
    - service: notify.ha_email
      data:
        title: "🌞 Ballon Eau Chaude - Démarrage"
        message: >
          Le ballon d'eau chaude a démarré grâce au surplus solaire.
          
          Surplus actuel: {{ states('sensor.puissance_surplus_solaire') }}W
          Production solaire: {{ states('sensor.ecu_current_power') }}W
          Seuil de démarrage: {{ states('input_number.ballon_seuil_demarrage') }}W
          Heure: {{ now().strftime('%H:%M') }}
  
  mode: single

# ============================================================
# 11.3 ARRÊT SURPLUS INSUFFISANT
# ============================================================
- id: ballon_arret_surplus
  alias: "Ballon - Arrêt surplus insuffisant"
  description: "Désactive le ballon quand surplus insuffisant"
  
  trigger:
    - platform: numeric_state
      entity_id: sensor.puissance_surplus_solaire
      below: input_number.ballon_seuil_arret
      for:
        minutes: 5
  
  condition:
    # Le ballon est en marche
    - condition: state
      entity_id: switch.ballon_eau_chaude
      state: 'on'
    
    # Et il était en mode surplus (pas forcé manuellement)
    - condition: state
      entity_id: input_select.ballon_statut
      state: "En chauffe (surplus)"
  
  action:
    # Désactiver le contacteur
    - service: switch.turn_off
      target:
        entity_id: switch.ballon_eau_chaude
    
    # Mettre à jour le statut
    - service: input_select.select_option
      target:
        entity_id: input_select.ballon_statut
      data:
        option: "En attente de surplus"
    
    # Notification dans HA
    - service: persistent_notification.create
      data:
        title: "⚡ Ballon Eau Chaude"
        message: >
          Arrêt - Surplus insuffisant
          
          Surplus actuel: {{ states('sensor.puissance_surplus_solaire') }}W
          Seuil arrêt: {{ states('input_number.ballon_seuil_arret') }}W
          Heure: {{ now().strftime('%H:%M') }}
    
    # Notification Email
    - service: notify.ha_email
      data:
        title: "⚡ Ballon Eau Chaude - Arrêt"
        message: >
          Le ballon d'eau chaude s'est arrêté (surplus insuffisant).
          
          Surplus actuel: {{ states('sensor.puissance_surplus_solaire') }}W
          Production solaire: {{ states('sensor.ecu_current_power') }}W
          Seuil d'arrêt: {{ states('input_number.ballon_seuil_arret') }}W
          Heure: {{ now().strftime('%H:%M') }}
  
  mode: single

# ============================================================
# 11.4 ARRÊT AU COUCHER DU SOLEIL
# ============================================================
- id: ballon_arret_coucher_soleil
  alias: "Ballon - Arrêt coucher du soleil"
  description: "Arrête le ballon au coucher du soleil"
  
  trigger:
    - platform: sun
      event: sunset
  
  condition:
    - condition: state
      entity_id: switch.ballon_eau_chaude
      state: 'on'
  
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.ballon_eau_chaude
    
    - service: input_select.select_option
      target:
        entity_id: input_select.ballon_statut
      data:
        option: "Arrêté"
    
    - service: persistent_notification.create
      data:
        title: "🌅 Ballon Eau Chaude"
        message: "Arrêt automatique (coucher du soleil)"
  
  mode: single

# ============================================================
# 11.5 SYNCHRONISATION STATUT
# ============================================================
- id: ballon_sync_statut
  alias: "Ballon - Synchronisation statut"
  description: "Met à jour le statut si le contacteur change d'état manuellement"
  
  trigger:
    - platform: state
      entity_id: switch.ballon_eau_chaude
  
  action:
    - choose:
        # Si allumé manuellement
        - conditions:
            - condition: state
              entity_id: switch.ballon_eau_chaude
              state: 'on'
            - condition: not
              conditions:
                - condition: state
                  entity_id: input_select.ballon_statut
                  state: "En chauffe (surplus)"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.ballon_statut
              data:
                option: "Chauffe forcée manuelle"
        
        # Si éteint manuellement
        - conditions:
            - condition: state
              entity_id: switch.ballon_eau_chaude
              state: 'off'
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.ballon_statut
              data:
                option: "Arrêté"
  
  mode: queued
# ============================================================

# ============================================================
# 12. FRIGO AMÉRICAIN - 3 PALIERS
# ============================================================
# ============================================================
# FRIGO/CONGÉLATEUR - BOOST SUR SURPLUS (PRIORITAIRE)
# ============================================================
# ------------------------------------------------------------
# FRIGO - PALIER 1 : Boost Températures (prioritaire)
# ------------------------------------------------------------
- id: frigo_activation_boost_temperatures
  alias: "Frigo - Activation boost températures"
  description: "Baisse les températures quand surplus >= 300W"
  
  trigger:
    - platform: numeric_state
      entity_id: sensor.puissance_surplus_solaire
      above: input_number.frigo_seuil_demarrage
      for:
        minutes: 2
  
  condition:
    # Pas déjà en mode boost
    - condition: state
      entity_id: input_select.frigo_statut
      state: "Normal"
    
    # Automation activée
    - condition: state
      entity_id: input_boolean.frigo_surplus_actif
      state: 'on'
    
    # Soleil levé
    - condition: sun
      after: sunrise
      before: sunset
  
  action:
    # Baisser températures
    - service: number.set_value
      target:
        entity_id: number.frigo_americain_temperature_du_frigo
      data:
        value: "{{ states('input_number.frigo_temp_boost') | int }}"
    
    - service: number.set_value
      target:
        entity_id: number.frigo_americain_temperature_du_congelateur
      data:
        value: "{{ states('input_number.congelateur_temp_boost') | int }}"
    
    # Mettre à jour le statut
    - service: input_select.select_option
      target:
        entity_id: input_select.frigo_statut
      data:
        option: "Boost (surplus)"
    
    # Notification
    - service: persistent_notification.create
      data:
        title: "❄️ Frigo - Boost températures"
        message: >
          Activation boost températures (Palier 1)
          
          Nouvelles consignes :
          - Frigo : {{ states('input_number.frigo_temp_boost') }}°C
          - Congélateur : {{ states('input_number.congelateur_temp_boost') }}°C
          
          Surplus : {{ states('sensor.puissance_surplus_solaire') }}W
  
  mode: single
# ============================================================

