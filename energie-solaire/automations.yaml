# FRIGO AMÉRICAIN - AUTOMATIONS 3 PALIERS
# Nomenclature clarifiée et seuil arrêt Power Boost
# ============================================================

# ============================================================
# PALIER 1 : Boost Températures (prioritaire)
# ============================================================
- id: frigo_activation_boost_temperatures
  alias: "Frigo - Activation boost températures"
