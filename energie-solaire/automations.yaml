# ============================================================
# PALIER 3 : Power Cool + Power Freeze (ballon ON + surplus)
# ============================================================
- id: frigo_activation_power_boost
  alias: "Frigo - Activation Mode Power Boost"
  description: "Active Power Cool/Freeze si ballon ON et surplus suffisant"
  
  trigger:
    - platform: numeric_state
      entity_id: sensor.puissance_surplus_solaire
      above: input_number.frigo_power_seuil_activation
      for:
        minutes: 3
  
  condition:
    # Ballon déjà en marche (Palier 2 actif)
    - condition: state
      entity_id: switch.ballon_eau_chaude
      state: 'on'
    
    # Frigo en mode boost températures (Palier 1 actif)
    - condition: state
      entity_id: input_select.frigo_statut
      state: "Boost (surplus)"
    
    # Power Cool/Freeze pas déjà activés
    - condition: state
      entity_id: switch.frigo_americain_power_cool
      state: 'off'
    
    - condition: state
      entity_id: switch.frigo_americain_power_freeze
      state: 'off'
    
    # Automation activée
    - condition: state
      entity_id: input_boolean.frigo_surplus_actif
      state: 'on'
    
    # Soleil levé
    - condition: sun
      after: sunrise
      before: sunset
  
  action:
    # Activer Power Cool
    - service: switch.turn_on
      target:
        entity_id: switch.frigo_americain_power_cool
    
    # Activer Power Freeze
    - service: switch.turn_on
      target:
        entity_id: switch.frigo_americain_power_freeze
    
    # Mettre à jour le statut
    - service: input_select.select_option
      target:
        entity_id: input_select.frigo_statut
      data:
        option: "Boost Max (surplus)"
    
    # Notification
    - service: persistent_notification.create
      data:
        title: "❄️❄️ Frigo - Mode Power Boost activé"
        message: >
          Activation Power Cool + Power Freeze
          
          Palier 1 : Températures boost ✅
          Palier 2 : Ballon ON ✅
          Palier 3 : Power Cool/Freeze ✅
          
          Surplus disponible : {{ states('sensor.puissance_surplus_solaire') }}W
          Consommation totale estimée : ~1950W
    
    # Email
    - service: notify.ha_email
      data:
        title: "❄️❄️ Frigo - Mode Power Boost activé"
        message: >
          Le frigo est passé en mode boost MAXIMUM !
          
          Power Cool : Activé
          Power Freeze : Activé
          Ballon : ON
          Températures : Boost
          
          Surplus : {{ states('sensor.puissance_surplus_solaire') }}W
          Heure : {{ now().strftime('%H:%M') }}
  
  mode: single

# ============================================================
# Désactivation Power Boost (surplus insuffisant)
# ============================================================
- id: frigo_desactivation_power_boost
  alias: "Frigo - Désactivation Mode Power Boost"
  description: "Désactive Power Cool/Freeze si surplus < seuil arrêt"
  
  trigger:
    - platform: numeric_state
      entity_id: sensor.puissance_surplus_solaire
      below: input_number.frigo_power_seuil_arret
      for:
        minutes: 10
  
  condition:
    # Power Cool ou Freeze activés
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.frigo_americain_power_cool
          state: 'on'
        - condition: state
          entity_id: switch.frigo_americain_power_freeze
          state: 'on'
  
  action:
    # Désactiver Power Cool/Freeze
    - service: switch.turn_off
      target:
        entity_id: 
          - switch.frigo_americain_power_cool
          - switch.frigo_americain_power_freeze
    
    # Retour statut Boost (températures restent baissées)
    - service: input_select.select_option
      target:
        entity_id: input_select.frigo_statut
      data:
        option: "Boost (surplus)"
    
    # Notification
    - service: persistent_notification.create
      data:
        title: "🔄 Frigo - Mode Power Boost désactivé"
        message: >
          Power Cool/Freeze désactivés (surplus insuffisant)
          
          Surplus : {{ states('sensor.puissance_surplus_solaire') }}W
          Seuil arrêt : {{ states('input_number.frigo_power_seuil_arret') }}W
          
          Boost températures reste actif
  
  mode: single

# ============================================================
# Désactivation Power Boost si ballon s'arrête
# ============================================================
- id: frigo_desactivation_power_boost_ballon_arret
  alias: "Frigo - Désactiver Power Boost si ballon arrêté"
  description: "Désactive Power Cool/Freeze si le ballon s'arrête"
  
  trigger:
    - platform: state
      entity_id: switch.ballon_eau_chaude
      to: 'off'
      for:
        seconds: 30
  
  condition:
    # Power Cool ou Freeze activés
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.frigo_americain_power_cool
          state: 'on'
        - condition: state
          entity_id: switch.frigo_americain_power_freeze
          state: 'on'
  
  action:
    # Désactiver Power Cool/Freeze
    - service: switch.turn_off
      target:
        entity_id: 
          - switch.frigo_americain_power_cool
          - switch.frigo_americain_power_freeze
    
    # Retour statut Boost (températures restent baissées)
    - service: input_select.select_option
      target:
        entity_id: input_select.frigo_statut
      data:
        option: "Boost (surplus)"
    
    # Notification
    - service: persistent_notification.create
      data:
        title: "🔄 Frigo - Mode Power Boost désactivé"
        message: >
          Power Cool/Freeze désactivés (ballon arrêté)
          
          Boost températures reste actif
  
  mode: single

# ============================================================
# Désactivation complète (retour normal)
# ============================================================
- id: frigo_desactivation_complete
  alias: "Frigo - Désactivation complète"
  description: "Remonte les températures et désactive Power Cool/Freeze"
  
  trigger:
    - platform: numeric_state
      entity_id: sensor.puissance_surplus_solaire
      below: input_number.frigo_seuil_arret
      for:
        minutes: 10
  
  condition:
    # En mode boost actuellement
    - condition: or
      conditions:
        - condition: state
          entity_id: input_select.frigo_statut
          state: "Boost (surplus)"
        - condition: state
          entity_id: input_select.frigo_statut
          state: "Boost Max (surplus)"
  
  action:
    # Désactiver Power Cool/Freeze (au cas où)
    - service: switch.turn_off
      target:
        entity_id: 
          - switch.frigo_americain_power_cool
          - switch.frigo_americain_power_freeze
    
    # Remonter température frigo
    - service: number.set_value
      target:
        entity_id: number.frigo_americain_temperature_du_frigo
      data:
        value: "{{ states('input_number.frigo_temp_normale') | int }}"
    
    # Remonter température congélateur
    - service: number.set_value
      target:
        entity_id: number.frigo_americain_temperature_du_congelateur
      data:
        value: "{{ states('input_number.congelateur_temp_normale') | int }}"
    
    # Mettre à jour le statut
    - service: input_select.select_option
      target:
        entity_id: input_select.frigo_statut
      data:
        option: "Normal"
    
    # Notification
    - service: persistent_notification.create
      data:
        title: "🔄 Frigo - Retour normal"
        message: >
          Retour aux températures normales
          
          Consignes :
          - Frigo : {{ states('input_number.frigo_temp_normale') }}°C
          - Congélateur : {{ states('input_number.congelateur_temp_normale') }}°C
          
          Surplus insuffisant : {{ states('sensor.puissance_surplus_solaire') }}W
  
  mode: single

# ============================================================
