          - Congélateur : {{ states('input_number.congelateur_temp_boost') }}°C
          
          Surplus : {{ states('sensor.puissance_surplus_solaire') }}W
          Seuil : {{ states('input_number.frigo_seuil_demarrage') }}W
    
    # Email (optionnel)
    - service: notify.ha_email
      data:
        title: "❄️ Frigo - Boost activé"
        message: >
          Le frigo est passé en mode boost températures.
          
          Nouvelles consignes :
          - Frigo : {{ states('input_number.frigo_temp_boost') }}°C
          - Congélateur : {{ states('input_number.congelateur_temp_boost') }}°C
          
