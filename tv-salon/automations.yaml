        title: "🔆 TV Salon - Rallumage soir"
        message: >
            Le disjoncteur TV a été rallumé pour le soir (jeudi {{ states('input_datetime.planning_normal_jeudi_soir_debut')[0:5] }}).
            Mode : Planning Normal
  mode: single

# ------------------------------------------------------------
# Rallumage soir vendredi
# ------------------------------------------------------------
# TRIGGER : Heure début soirée planning lundi
# CONDITIONS :
#   1. Coupure auto activée
#   2. Disjoncteur OFF
#   3. Mode Planning Normal OU Éco
#   4. Vendredi
#   5. PAS jour férié
# ACTIONS :
#   1. Rallume le disjoncteur
#   2. Envoie email
# ------------------------------------------------------------
- id: tv_salon_rallumage_soir_vendredi
  alias: "TV Salon - Rallumage soir vendredi"
  description: "Rallume le disjoncteur TV le vendredi soir selon planning chauffage"
  trigger:
    - platform: template
      value_template: >
        {{ now().strftime('%H:%M') == states('input_datetime.planning_normal_vendredi_soir_debut')[0:5] }}
  condition:
    # Condition 1 : Coupure auto activée
    - condition: state
      entity_id: input_boolean.tv_salon_auto_coupure
      state: "on"

    # Condition 2 : Disjoncteur OFF
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "off"

    # Condition 3 : Mode Planning Normal
    - condition: state
      entity_id: input_boolean.mode_planning_normal
      state: "on"
 
     # Condition 4 : Vendredi
    - condition: time
      weekday:
        - fri

    # Condition 5 : PAS jour férié
    - condition: template
      value_template: >
        {{ states('calendar.jours_feries_en_france') == 'off' }}
  action:

    # Action 1 : Rallume le disjoncteur
    - service: switch.turn_on
      target:
        entity_id: switch.salon_tv_home_cinema

    # Action 2 : Envoie email
    - service: notify.ha_email
      data:
        title: "🔆 TV Salon - Rallumage soir"
        message: >
            Le disjoncteur TV a été rallumé pour le soir (vendredi {{ states('input_datetime.planning_normal_vendredi_soir_debut')[0:5] }}).
            Mode : Planning Normal
  mode: single

# ============================================================
# Rallumage immédiat si passage vers mode sans coupure journée
# ============================================================
# MODES CONCERNÉS : Télétravail, Weekend+, Vacances Maison, Manuel
# LOGIQUE : Si on passe vers un de ces modes pendant la journée,
#           on rallume immédiatement le disjoncteur (car pas de coupure journée)
# ============================================================
- id: tv_salon_rallumage_changement_mode_sans_coupure
  alias: "TV Salon - Rallumage changement vers mode sans coupure journée"
  description: "Rallume le disjoncteur si passage vers Télétravail/Weekend+/Vacances Maison/Manuel"
  trigger:
    # Trigger 1 : Passage en Télétravail
    - platform: state
      entity_id: input_boolean.mode_planning_teletravail
      to: "on"
    
    # Trigger 2 : Passage en Weekend+
    - platform: state
      entity_id: input_boolean.mode_planning_weekend_prolonge
      to: "on"
    
    # Trigger 3 : Passage en Vacances Maison
    - platform: state
      entity_id: input_boolean.mode_planning_vacances_maison
      to: "on"
    
    # Trigger 4 : Passage en Manuel
    - platform: state
      entity_id: input_boolean.chauffage_manuel
      to: "on"
  condition:
    # Condition 1 : Disjoncteur OFF
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "off"
    
    # Condition 2 : Lundi-Vendredi (car weekend déjà pas de coupure journée)
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    
    # Condition 3 : Pas jour férié
    - condition: template
      value_template: >
        {{ states('calendar.jours_feries_en_france') == 'off' }}
    
    # Condition 4 : Entre 08:00 et heure rallumage soir (période où le disjoncteur serait normalement coupé en Planning Normal)
    - condition: template
      value_template: >
        {% set now_time = now().strftime('%H:%M') %}
        {% set day_name = now().strftime('%A').lower() %}
        
        {# Détermine l'heure de rallumage soir selon le jour #}
        {% if day_name == 'monday' %}
          {% set heure_rallumage = states('input_datetime.planning_normal_lundi_soir_debut')[0:5] %}
        {% elif day_name == 'tuesday' %}
          {% set heure_rallumage = states('input_datetime.planning_normal_mardi_soir_debut')[0:5] %}
        {% elif day_name == 'wednesday' %}
          {% set heure_rallumage = states('input_datetime.planning_normal_mercredi_soir_debut')[0:5] %}
        {% elif day_name == 'thursday' %}
          {% set heure_rallumage = states('input_datetime.planning_normal_jeudi_soir_debut')[0:5] %}
        {% elif day_name == 'friday' %}
          {% set heure_rallumage = states('input_datetime.planning_normal_vendredi_soir_debut')[0:5] %}
        {% endif %}
        
        {{ now_time >= '08:00' and now_time < heure_rallumage }}
  action:
    # Action 1 : Rallume le disjoncteur
    - service: switch.turn_on
      target:
        entity_id: switch.salon_tv_home_cinema
    
    # Action 2 : Envoie email
    - service: notify.ha_email
      data:
        title: "🏠 TV Salon - Changement mode planning"
        message: >
          Le disjoncteur TV a été rallumé suite au changement de mode planning.
          Nouveau mode : {% if is_state('input_boolean.mode_planning_teletravail', 'on') %}Télétravail{% elif is_state('input_boolean.mode_planning_weekend_prolonge', 'on') %}Weekend+{% elif is_state('input_boolean.mode_planning_vacances_maison', 'on') %}Vacances Maison{% elif is_state('input_boolean.chauffage_manuel', 'on') %}Manuel{% else %}Inconnu{% endif %}
  mode: single

# ============================================================
# Coupure si passage vers Planning Normal avant rallumage soir
# ============================================================
# LOGIQUE : Si on passe en Planning Normal pendant la journée,
#           ET qu'il reste plus de 30 min avant l'heure de rallumage soir,
#           on coupe le disjoncteur (départ au travail tardif)
# ============================================================
- id: tv_salon_coupure_changement_vers_planning_normal
  alias: "TV Salon - Coupure changement vers Planning Normal"
  description: "Coupe le disjoncteur si passage vers Planning Normal >30min avant rallumage soir"
  trigger:
    - platform: state
      entity_id: input_boolean.mode_planning_normal
      to: "on"
  condition:
    # Condition 1 : Disjoncteur ON
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "on"
    
    # Condition 2 : Lundi-Jeudi
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
    
    # Condition 3 : Pas jour férié
    - condition: template
      value_template: >
        {{ states('calendar.jours_feries_en_france') == 'off' }}
    
    # Condition 4 : Plus de 30 min avant l'heure de rallumage soir
    - condition: template
      value_template: >
        {% set now_time = now() %}
        {% set day_name = now_time.strftime('%A').lower() %}
        
        {# Détermine l'heure de rallumage soir selon le jour #}
        {% if day_name == 'monday' %}
          {% set heure_rallumage_str = states('input_datetime.planning_normal_lundi_soir_debut') %}
        {% elif day_name == 'tuesday' %}
          {% set heure_rallumage_str = states('input_datetime.planning_normal_mardi_soir_debut') %}
        {% elif day_name == 'wednesday' %}
          {% set heure_rallumage_str = states('input_datetime.planning_normal_mercredi_soir_debut') %}
        {% elif day_name == 'thursday' %}
          {% set heure_rallumage_str = states('input_datetime.planning_normal_jeudi_soir_debut') %}
        {% elif day_name == 'friday' %}
          {% set heure_rallumage_str = states('input_datetime.planning_normal_vendredi_soir_debut') %}
        {% endif %}
        
        {# Convertit l'heure de rallumage en timestamp #}
        {% set heure_parts = heure_rallumage_str.split(':') %}
        {% set heure_rallumage = now_time.replace(hour=heure_parts[0]|int, minute=heure_parts[1]|int, second=0) %}
        
        {# Calcule la différence en minutes #}
        {% set minutes_avant_rallumage = ((heure_rallumage.timestamp() - now_time.timestamp()) / 60) | int %}
        
        {# Vérifie qu'il reste plus de 30 minutes #}
        {{ minutes_avant_rallumage > 30 }}
  action:
    # Action 1 : Attend le refroidissement AVANT de couper
    - wait_template: >
        {% set last_off = as_timestamp(states('input_datetime.tv_salon_last_off')) | default(0) %}
        {% set last_on = as_timestamp(states('input_datetime.tv_salon_last_on')) | default(0) %}
        {% set now_ts = now().timestamp() %}
        
        {# Vérifie que la TV est éteinte #}
        {% set tv_off = is_state('media_player.lg_webos_tv_oled77g54lw', 'off') or is_state('media_player.lg_webos_tv_oled77g54lw', 'unavailable') %}
        
        {# Vérifie que last_off > last_on #}
        {% set last_off_after_on = last_off > last_on %}
        
        {# Vérifie le délai de refroidissement #}
        {% set delai = states('input_number.tv_salon_delai_refroidissement') | float(60) %}
        {% set minutes_depuis = ((now_ts - last_off) / 60) | int %}
        {% set refroidissement_ok = minutes_depuis >= delai %}
        
        {{ tv_off and last_off_after_on and refroidissement_ok }}
      timeout: "02:00:00"  # Attend maximum 2h
      continue_on_timeout: false
    
    # Action 2 : Coupe le disjoncteur
    - service: switch.turn_off
      target:
        entity_id: switch.salon_tv_home_cinema
    
    # Action 3 : Enregistre heure coupure
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tv_salon_last_disjoncteur_tv_off
      data:
        datetime: "{{ now() }}"
    
    # Action 4 : Envoie email
    - service: notify.ha_email
      data:
        title: "🔌 TV Salon - Coupure changement Planning Normal"
        message: >
          Le disjoncteur TV a été coupé suite au passage en mode Planning Normal.
          TV éteinte et refroidissement terminé.
  mode: single
  
# ------------------------------------------------------------
# Vérification quotidienne vacances
# ------------------------------------------------------------
# TRIGGER : 02:00 chaque jour
# CONDITIONS :
#   1. Mode Vacances actif
#   2. Disjoncteur ON (anormal)
# ACTIONS :
#   1. Coupe le disjoncteur
#   2. Enregistre heure coupure
#   3. Envoie email d'alerte
# ------------------------------------------------------------
- id: tv_salon_verification_quotidienne_vacances
  alias: "TV Salon - Vérification quotidienne mode Vacances"
  description: "Vérifie que le disjoncteur TV est bien coupé chaque jour en mode Vacances"
  trigger:
    - platform: time
      at: "02:00:00"
  condition:
    # Condition 1 : Mode Vacances
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "on"
    # Condition 2 : Disjoncteur ON (ne devrait pas)
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "on"
  action:
    # Action 1 : Coupe le disjoncteur
    - service: switch.turn_off
      target:
        entity_id: switch.salon_tv_home_cinema
    # Action 2 : Enregistre heure coupure
    - service: input_datetime.set_datetime  # ← AJOUT
      target:
        entity_id: input_datetime.tv_salon_last_disjoncteur_tv_off
      data:
        datetime: "{{ now() }}"
    # Action 3 : Envoie email d'alerte
    - service: notify.ha_email  # ← AJOUT NOTIFICATION
      data:
        title: "✈️ TV Salon - Mode Vacances activé"
        message: >
          Le disjoncteur TV a été coupé suite au passage en mode Vacances.
          Bon voyage ! 🏖️
  mode: single

