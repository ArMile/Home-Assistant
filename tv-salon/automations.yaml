# ============================================================
# MODE VACANCES (ABSENCE)
# ============================================================
# ------------------------------------------------------------
# Coupure départ vacances
# ------------------------------------------------------------
# TRIGGER : Passage en mode Vacances
# CONDITIONS :
#   1. Disjoncteur ON
# ACTIONS :
#   1. Coupe le disjoncteur immédiatement
#   2. Enregistre heure coupure
#   3. Envoie email "Bon voyage"
# ------------------------------------------------------------
- id: tv_salon_coupure_depart_vacances
  alias: "TV Salon - Coupure disjoncteur TV - départ Vacances"
  description: "Coupe immédiatement le disjoncteur TV au passage en mode Vacances"
  trigger:
    - platform: state
      entity_id: input_boolean.mode_vacances
      to: "on"
  condition:
    # Condition 1 : Disjoncteur ON
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "on"
  action:
    # Action 1 : Coupe le disjoncteur
    - service: switch.turn_off
      target:
        entity_id: switch.salon_tv_home_cinema
    # Action 2 : Enregistre heure coupure
    - service: input_datetime.set_datetime  # ← AJOUT
      target:
        entity_id: input_datetime.tv_salon_last_disjoncteur_tv_off
      data:
        datetime: "{{ now() }}"
    # Action 3 : Envoie email
    - service: notify.ha_email  # ← AJOUT NOTIFICATION
      data:
        title: "✈️ TV Salon - Mode Vacances immédiat activé"
        message: >
          Le disjoncteur TV a été coupé immédiatement suite au passage en mode Vacances.
          Bon voyage ! 🏖️
  mode: single

# ============================================================
# RALLUMAGE MATINAL
# ============================================================

# ------------------------------------------------------------
# Rallumage matinal 06:00 (tous les jours sauf Vacances)
# ------------------------------------------------------------
# TRIGGER : 06:00 précises (configurable)
# CONDITIONS :
#   1. PAS en mode Vacances
#   2. Disjoncteur OFF
# ACTIONS :
#   1. Rallume le disjoncteur
#   2. Envoie email avec mode actif
# ------------------------------------------------------------
- id: tv_salon_rallumage_matinal_disjoncteur_tv
  alias: "TV Salon - Rallumage matinal disjoncteur TV"
  description: "Rallume le disjoncteur TV chaque matin sauf en mode Vacances"
  trigger:
    - platform: template
      value_template: >
        {{ now().strftime('%H:%M') == states('input_datetime.tv_salon_rallumage_matin')[0:5] }}
  condition:
    # Condition 1 : PAS en mode Vacances
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "off"
    # Condition 2 : Disjoncteur OFF
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "off"
  action:
    # Action 1 : Rallume le disjoncteur
    - service: switch.turn_on
      target:
        entity_id: switch.salon_tv_home_cinema
    # Action 2 : Envoie email
    - service: notify.ha_email  # ← AJOUT NOTIFICATION
      data:
        title: "☀️ TV Salon - Rallumage matinal"
        message: >
            Le disjoncteur TV a été rallumé à {{ states('input_datetime.tv_salon_rallumage_matin')[0:5] }} comme prévu.
            Mode : {% if is_state('input_boolean.mode_planning_normal', 'on') %}Planning Normal{% elif is_state('input_boolean.mode_planning_teletravail', 'on') %}Télétravail{% elif is_state('input_boolean.mode_planning_vacances_maison', 'on') %}Vacances Maison{% elif is_state('input_boolean.mode_planning_weekend_prolonge', 'on') %}Weekend+{% elif is_state('input_boolean.chauffage_manuel', 'on') %}Manuel{% else %}Autre{% endif %}
  mode: single

