# 13. TV SALON
# ============================================================
# ============================================================
# AUTOMATIONS TV SALON
# ============================================================

# ============================================================
# TRACE ALLUMAGE / EXTINCTION / COUPURE
# ============================================================

# ------------------------------------------------------------
# Trace allumage TV - Basé sur consommation + état media_player
# ------------------------------------------------------------
# TRIGGER : Consommation > 50W pendant 10 secondes
# CONDITIONS :
#   1. Media player = "on" (vraie allumage, pas juste pic de veille)
#   2. Délai > 60s depuis dernier allumage (anti-rebond)
# ACTION : Enregistre heure actuelle dans input_datetime.tv_salon_last_on
# ------------------------------------------------------------
- id: tv_salon_trace_allumage_tv
  alias: "TV Salon - Trace allumage TV"
  description: "Enregistre l'heure d'allumage de la TV (basé sur consommation)"
  trigger:
    - platform: numeric_state
      entity_id: sensor.salon_tv_home_cinema_power
      above: 50
      for:
        seconds: 10
  condition:
    # Condition 1 : Disjoncteur ON (évite faux positifs après rallumage)
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "on"
    
    # Condition 2 : PAS dans les 10 min après changement disjoncteur
    - condition: template
      value_template: >
        {% set disjoncteur_last_changed = as_timestamp(states.switch.salon_tv_home_cinema.last_changed) | default(0) %}
        {% set now_ts = now().timestamp() %}
        {% set minutes_since_change = ((now_ts - disjoncteur_last_changed) / 60) | int %}
        {{ minutes_since_change > 10 }}
    
    # Condition 3 : Anti-rebond (60s entre deux enregistrements)
    - condition: template
      value_template: >
        {% set last_on_str = states('input_datetime.tv_salon_last_on') %}
        {% if last_on_str in ['unknown', 'unavailable'] %}
          true
        {% else %}
          {% set last_on = as_timestamp(last_on_str) | default(0) %}
          {% set now_ts = now().timestamp() %}
          {{ (now_ts - last_on) > 60 }}
        {% endif %}
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tv_salon_last_on
      data:
        datetime: "{{ now() }}"
  mode: single

# ------------------------------------------------------------
# Trace extinction TV - Basé sur consommation
# ------------------------------------------------------------
# TRIGGER : Consommation < 10W pendant 10 secondes
# CONDITIONS :
#   1. Disjoncteur = ON (sinon c'est une coupure disjoncteur, pas extinction TV)
#   2. Délai > 60s depuis dernière extinction (anti-rebond) & 10mn si suite redémarrage disjoncteur
# ACTION : Enregistre heure actuelle dans input_datetime.tv_salon_last_off
# ------------------------------------------------------------
- id: tv_salon_trace_extinction_tv
  alias: "TV Salon - Trace extinction TV"
  description: "Enregistre l'heure d'extinction de la TV (basé sur consommation)"
  trigger:
    - platform: numeric_state
      entity_id: sensor.salon_tv_home_cinema_power
      below: 10
      for:
        seconds: 10
  condition:
    # Condition 1 : Disjoncteur ON
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "on"
    
    # Condition 2 : PAS dans les 10 min après changement état disjoncteur
    - condition: template
      value_template: >
        {% set disjoncteur_last_changed = as_timestamp(states.switch.salon_tv_home_cinema.last_changed) | default(0) %}
        {% set now_ts = now().timestamp() %}
        {% set minutes_since_change = ((now_ts - disjoncteur_last_changed) / 60) | int %}
        {{ minutes_since_change > 10 }}
    
    # Condition 3 : Anti-rebond (60s entre deux enregistrements)
    - condition: template
      value_template: >
        {% set last_off_str = states('input_datetime.tv_salon_last_off') %}
        {% if last_off_str in ['unknown', 'unavailable'] %}
          true
        {% else %}
          {% set last_off = as_timestamp(last_off_str) | default(0) %}
          {% set now_ts = now().timestamp() %}
          {{ (now_ts - last_off) > 60 }}
        {% endif %}
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tv_salon_last_off
      data:
        datetime: "{{ now() }}"
  mode: single

# ============================================================
# Trace coupure disjoncteur TV (manuelle ou automatique)
# ============================================================
- id: tv_salon_trace_coupure_disjoncteur_universelle
  alias: "TV Salon - Trace coupure disjoncteur (universelle)"
  description: "Enregistre toute coupure du disjoncteur TV (manuelle ou automatique)"
  trigger:
    - platform: state
      entity_id: switch.salon_tv_home_cinema
      to: "off"
      from: "on"
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tv_salon_last_disjoncteur_tv_off
      data:
        datetime: "{{ now() }}"
  mode: single
# ============================================================

# ============================================================
# COUPURES AUTOMATIQUES
# ============================================================

# ============================================================
# Coupure automatique TV (limite OU refroidissement)
# ============================================================
- id: tv_salon_coupure_automatique
  alias: "TV Salon - Coupure automatique (limite ou refroidissement)"
  description: "Coupe le disjoncteur à l'heure limite OU après refroidissement"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    # Condition 1 : Coupure auto activée
    - condition: state
      entity_id: input_boolean.tv_salon_auto_coupure
      state: "on"
    
    # Condition 2 : Disjoncteur ON
    - condition: state
      entity_id: switch.salon_tv_home_cinema
      state: "on"
    
    # Condition 3 : TV éteinte
    - condition: or
      conditions:
        - condition: state
          entity_id: media_player.lg_webos_tv_oled77g54lw
          state: "off"
        - condition: state
          entity_id: media_player.lg_webos_tv_oled77g54lw
          state: "unavailable"
    
    # Condition 4 : Modes appropriés (PAS Vacances)
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: "off"
    
    # Condition 5 : last_off > last_on
    - condition: template
      value_template: >
        {% set last_off = as_timestamp(states('input_datetime.tv_salon_last_off')) | default(0) %}
        {% set last_on = as_timestamp(states('input_datetime.tv_salon_last_on')) | default(0) %}
        {{ last_off > last_on }}
    
    # Condition 6 : (Après heure limite ET refroidissement écoulé)
    - condition: template
      value_template: >
        {% set now_ts = now().timestamp() %}
        {% set last_off = as_timestamp(states('input_datetime.tv_salon_last_off')) | default(0) %}
        
        {# Détermine l'heure limite selon le jour #}
        {% set calendar_state = states('calendar.jours_feries_en_france') %}
        {% set is_ferie = calendar_state == 'on' %}
        
        {% if now().weekday() in [4,5,6] or is_ferie %}
          {% set heure_limite_str = states('input_datetime.tv_salon_heure_limite_weekend') %}
        {% else %}
          {% set heure_limite_str = states('input_datetime.tv_salon_heure_limite_semaine') %}
        {% endif %}
        
        {# Convertit l'heure limite en timestamp #}
        {% set heure_parts = heure_limite_str.split(':') %}
        {% set heure_limite_today = now().replace(hour=heure_parts[0]|int, minute=heure_parts[1]|int, second=0, microsecond=0) %}
        {% set heure_limite_ts = heure_limite_today.timestamp() %}
        
        {# Gère le passage de minuit #}
        {% if now_ts < heure_limite_ts and last_off > 0 %}
          {% set last_off_date = as_timestamp(states('input_datetime.tv_salon_last_off')) | timestamp_custom('%Y-%m-%d', true) %}
          {% set today_date = now().strftime('%Y-%m-%d') %}
          
          {% if last_off_date != today_date %}
            {% set yesterday = now() - timedelta(days=1) %}
            {% set heure_limite_yesterday = yesterday.replace(hour=heure_parts[0]|int, minute=heure_parts[1]|int, second=0, microsecond=0) %}
            {% set heure_limite_ts = heure_limite_yesterday.timestamp() %}
          {% endif %}
        {% endif %}
        
        {# Vérification des conditions de coupure #}
        {% if now_ts >= heure_limite_ts %}
          {# Après ou À l'heure limite → Vérifie refroidissement #}
          {% set delai = states('input_number.tv_salon_delai_refroidissement') | float(60) %}
          {% set minutes_depuis = ((now_ts - last_off) / 60) | int %}
          {% set heures_depuis = minutes_depuis / 60 %}
          
          {# Coupe si refroidissement OK ET extinction < 12h #}
          {{ minutes_depuis >= delai and heures_depuis < 12 }}
        {% else %}
          {# Avant heure limite → Pas de coupure #}
          false
        {% endif %}
    
    # Condition 7 : PAS DE RALLUMAGE RÉCENT (au moins 10 min)
    - condition: template
      value_template: >
        {% set disjoncteur_last_changed = as_timestamp(states.switch.salon_tv_home_cinema.last_changed) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set minutes_since_change = ((now_ts - disjoncteur_last_changed) / 60) | int %}
        {{ minutes_since_change > 10 }}
    
    # Condition 8 : PAS DANS LA FENÊTRE PROTÉGÉE 06:00-08:00
    - condition: template
      value_template: >
        {% set heure_actuelle = now().hour * 60 + now().minute %}
        {% set debut_fenetre = 6 * 60 %}
        {% set fin_fenetre = 8 * 60 %}
        {{ heure_actuelle < debut_fenetre or heure_actuelle >= fin_fenetre }}
    
    # Condition 9 : EN MODE TÉLÉTRAVAIL/VACANCES MAISON/WEEKEND+ → PAS DE COUPURE AVANT HEURE LIMITE DU SOIR
    - condition: template
      value_template: >
        {% set mode_teletravail = is_state('input_boolean.mode_planning_teletravail', 'on') %}
        {% set mode_vacances_maison = is_state('input_boolean.mode_planning_vacances_maison', 'on') %}
        {% set mode_weekend_prolonge = is_state('input_boolean.mode_planning_weekend_prolonge', 'on') %}
        
        {% if mode_teletravail or mode_vacances_maison or mode_weekend_prolonge %}
          {# En mode actif → Vérifier qu'on est bien après l'heure limite du soir #}
          {% set now_ts = now().timestamp() %}
          {% set calendar_state = states('calendar.jours_feries_en_france') %}
          {% set is_ferie = calendar_state == 'on' %}
          
          {% if now().weekday() in [4,5,6] or is_ferie %}
            {% set heure_limite_str = states('input_datetime.tv_salon_heure_limite_weekend') %}
          {% else %}
            {% set heure_limite_str = states('input_datetime.tv_salon_heure_limite_semaine') %}
          {% endif %}
          
          {% set heure_parts = heure_limite_str.split(':') %}
          {% set heure_limite_today = now().replace(hour=heure_parts[0]|int, minute=heure_parts[1]|int, second=0, microsecond=0) %}
          {% set heure_limite_ts = heure_limite_today.timestamp() %}
          
          {# Autoriser coupure UNIQUEMENT après heure limite du soir #}
          {{ now_ts >= heure_limite_ts }}
        {% else %}
          {# Mode Normal → Pas de restriction supplémentaire #}
          true
        {% endif %}

    # Condition 10 : EN MODE NORMAL WEEKEND/FÉRIÉ → PAS DE COUPURE AVANT HEURE LIMITE DU JOUR ACTUEL
    - condition: template
      value_template: >
        {% set jour_semaine = now().weekday() %}
        {% set est_ferie = is_state('calendar.jours_feries_en_france', 'on') %}
        {% set est_weekend = (jour_semaine in [5, 6]) or est_ferie %}
        
        {% set mode_normal = is_state('input_boolean.chauffage_manuel', 'off') 
                         and is_state('input_boolean.mode_vacances', 'off')
                         and is_state('input_boolean.mode_planning_teletravail', 'off')
                         and is_state('input_boolean.mode_planning_vacances_maison', 'off')
                         and is_state('input_boolean.mode_planning_weekend_prolonge', 'off') %}
        
        {% if mode_normal and est_weekend %}
          {# Mode Normal weekend/férié → Vérifier qu'on est après l'heure limite DU JOUR ACTUEL #}
          {% set heure_limite_str = states('input_datetime.tv_salon_heure_limite_weekend') %}
          {% set heure_parts = heure_limite_str.split(':') %}
          {% set heure_actuelle = now().hour * 60 + now().minute %}
          {% set heure_limite_minutes = heure_parts[0]|int * 60 + heure_parts[1]|int %}
          
          {# Si on est après minuit (00:00-05:59), considérer qu'on est après la limite de la veille #}
          {% if heure_actuelle < 360 %}
            true
          {% else %}
            {{ heure_actuelle >= heure_limite_minutes }}
          {% endif %}
        {% else %}
          {# Autres modes/jours → Pas de restriction supplémentaire #}
          true
        {% endif %}
        
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.salon_tv_home_cinema
    
    - delay:
        seconds: 2
  
  mode: single
